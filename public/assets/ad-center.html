<title>WeAgri Ad Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#16243f; --navy-2:#1e3358;
  --forest:#1f3d2b; --forest-2:#2d5239; --leaf:#3f7d4f; --leaf-soft:#e3efe4;
  --maize:#e8b04b; --maize-soft:#f7e7c4; --clay:#c85a3a; --clay-soft:#f6ddd2;
  --bone:#f4efe2; --bone-2:#ece4d2; --card:#fffdf8; --ink:#20211c; --ink-soft:#5b5a4f;
  --line:#e2dbc8; --shadow:0 10px 30px -12px rgba(31,61,43,.28); --shadow-sm:0 4px 14px -8px rgba(31,61,43,.3);
  --radius:22px; --radius-sm:14px;
  --display:'Bricolage Grotesque',sans-serif; --body:'Plus Jakarta Sans',sans-serif;
  --boost:linear-gradient(100deg,#1f3d2b 0%,#3f7d4f 55%,#c85a3a 100%);
  --glass-bg:rgba(255,253,248,.6); --glass-border:rgba(255,255,255,.5); --glass-blur:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{min-height:100%}
body{font-family:var(--body);background:var(--bone);color:var(--ink);-webkit-font-smoothing:antialiased}
#root{max-width:1080px;margin:0 auto;position:relative;min-height:100vh}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.08;letter-spacing:-.02em}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--body);font-size:16px}
.muted{color:var(--ink-soft)} .center{text-align:center}
.app-shell{min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.page-pad{padding:22px}
@media(min-width:720px){.page-pad{padding:34px 40px}}
.wrap{max-width:600px;margin-inline:auto}
.wrap-wide{max-width:880px;margin-inline:auto}

.fade-in{animation:fade .4s cubic-bezier(.22,1,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s cubic-bezier(.22,1,.36,1) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:16px 22px;border-radius:var(--radius-sm);font-weight:700;font-size:16px;
  transition:transform .15s,box-shadow .2s,opacity .2s,filter .2s}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:var(--forest);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-maize{background:var(--maize);color:var(--forest);box-shadow:var(--shadow-sm)}
.btn-ghost{background:var(--card);color:var(--forest);border:1.5px solid var(--line)}
.btn-clay{background:var(--clay);color:#fff}
.btn-grad{background:var(--boost);color:#fff;box-shadow:0 10px 26px -10px rgba(31,61,43,.5)}
.btn-grad:hover{filter:brightness(1.08)}
.btn-sm{width:auto;padding:10px 16px;font-size:13px;border-radius:11px}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px}
.field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px}
.input,.select,.textarea{width:100%;padding:14px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(63,125,79,.12)}
.textarea{resize:vertical;min-height:96px}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm)}

.glass{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);border-radius:28px;box-shadow:0 20px 60px -24px rgba(20,30,20,.35)}
html.dark .glass{--glass-bg:rgba(27,34,40,.55);--glass-border:rgba(255,255,255,.08)}

.hero-bg{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--forest) 0%,var(--forest-2) 55%,var(--navy) 100%);min-height:100vh}
.hero-bg::before,.hero-bg::after{content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 16s ease-in-out infinite}
.hero-bg::before{width:340px;height:340px;background:var(--maize);top:-80px;left:-100px}
.hero-bg::after{width:380px;height:380px;background:var(--clay);bottom:-120px;right:-100px;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-26px) scale(1.08)}}
.hero-blob{position:absolute;border-radius:50%;background:var(--leaf);width:240px;height:240px;filter:blur(60px);opacity:.4;top:40%;left:50%;transform:translate(-50%,-50%);animation:float 12s ease-in-out infinite reverse}

.steps{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.steps .seg{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.steps .seg i{display:block;height:100%;width:0;background:var(--leaf);transition:width .4s cubic-bezier(.22,1,.36,1)}
.steps .seg.done i{width:100%} .steps .seg.cur i{width:55%}

.lang-list{display:flex;flex-direction:column;gap:10px}
.lang-item{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;text-align:left;border-radius:16px}
.lang-item .flag{font-size:21px;flex-shrink:0;width:30px;text-align:center}
.lang-item .label{flex:1;display:flex;flex-direction:column;min-width:0}
.lang-item .label b{font-size:13.5px;letter-spacing:.02em}
.lang-item .label .sub{font-size:12px;opacity:.75;margin-top:1px}
.lang-item .check{width:22px;height:22px;border-radius:50%;background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}

.input-lg{padding:18px 20px;font-size:16.5px;border-radius:16px}

.plan{position:relative;border-radius:28px;padding:26px 22px;cursor:pointer;transition:transform .2s,box-shadow .2s;border:2px solid var(--line);background:var(--card)}
.plan:hover{transform:translateY(-3px)}
.plan.sel{border-color:transparent;box-shadow:0 0 0 3px var(--leaf),var(--shadow)}
.plan.premium{color:#fff;background:linear-gradient(160deg,#16243f,#1f3d2b 55%,#14241a);border-color:transparent}
.plan.premium.sel{box-shadow:0 0 0 3px var(--maize),0 20px 50px -16px rgba(31,61,43,.65)}
.plan .price{font-family:var(--display);font-size:34px;font-weight:800;margin:10px 0 2px}
.plan .approx{font-size:12.5px;opacity:.75}
.plan ul{list-style:none;margin:16px 0 0;display:flex;flex-direction:column;gap:9px}
.plan li{font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.plan .reach{margin-top:16px;padding-top:14px;border-top:1px solid rgba(125,125,125,.25);font-size:12.5px;font-weight:700}

.checklist{display:flex;flex-direction:column;gap:14px}
.cl-row{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:rgba(255,255,255,.6);opacity:.5;transition:opacity .3s}
.cl-row.active,.cl-row.done{opacity:1;color:#fff}
.cl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.18);transition:background .3s,transform .3s;font-size:12px;color:#fff}
.cl-row.active .cl-dot{background:var(--maize);color:#3a2f00;animation:pulse 1.1s ease-in-out infinite}
.cl-row.done .cl-dot{background:var(--leaf);color:#fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:36px 18px;text-align:center;transition:border-color .2s,background .2s;cursor:pointer}
.dropzone.drag{border-color:var(--leaf);background:var(--leaf-soft)}
.progress-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.progress-bar i{display:block;height:100%;background:var(--leaf);width:0%;transition:width .25s}

.filmstrip-outer{position:relative;padding:0 14px;margin:18px 0 8px;height:64px}
.filmstrip-inner{position:relative;height:64px;border-radius:12px;overflow:hidden;background:var(--bone-2);display:flex}
.filmstrip-inner .frame{flex:1;height:100%;background-size:cover;background-position:center;background-color:#1b2228}
.fs-dim{position:absolute;top:0;bottom:0;background:rgba(10,12,10,.62);z-index:2;pointer-events:none}
.fs-selection{position:absolute;top:-3px;bottom:-3px;border:3px solid var(--maize);border-radius:14px;z-index:3;pointer-events:none;box-shadow:0 0 0 2000px rgba(10,12,10,0) }
.fs-handle{position:absolute;top:-3px;bottom:-3px;width:22px;margin-left:-11px;z-index:4;display:flex;align-items:center;justify-content:center;cursor:ew-resize;touch-action:none}
.fs-handle .grip{width:22px;height:100%;background:var(--maize);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.fs-handle .grip i{width:3px;height:16px;background:rgba(31,61,43,.65);border-radius:2px;display:block}
.fs-handle:active .grip{filter:brightness(1.08)}
.fs-time-bubble{position:absolute;top:-30px;transform:translateX(-50%);background:var(--forest);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap;z-index:5}
.trim-readout{display:flex;justify-content:space-between;font-size:12.5px;margin:6px 14px 0}

.status-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.st-draft{background:var(--line);color:var(--ink-soft)}
.st-submitted,.st-processing,.st-in_review,.st-pending_payment{background:var(--maize-soft);color:#8a6418}
.st-approved,.st-live{background:var(--leaf-soft);color:var(--forest)}
.st-rejected{background:var(--clay-soft);color:var(--clay)}
.st-paused,.st-completed{background:var(--line);color:var(--ink-soft)}

.stat{padding:18px;border-radius:var(--radius)}
.stat .v{font-size:23px;font-weight:800;font-family:var(--display)}
.stat .l{font-size:12px;opacity:.75;margin-top:2px}

.empty{text-align:center;padding:54px 20px}
.empty .em{font-size:50px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--leaf-soft);border-top-color:var(--leaf);margin:36px auto;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--bone-2) 25%,#e3dbc4 50%,var(--bone-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
html.dark .skel{background:linear-gradient(90deg,#1b2228 25%,#242e35 50%,#1b2228 75%);background-size:200% 100%}

.chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--forest);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:pop .2s both}
#errbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#7a1f1f;color:#fff;font-size:13px;padding:10px 14px;display:none;font-family:monospace}
#errbar.show{display:block}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px}
@media(min-width:720px){.topbar{padding:20px 40px}}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:17px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line)}

.success-ring{width:96px;height:96px;border-radius:50%;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .4s cubic-bezier(.22,1,.36,1) both}

::-webkit-scrollbar{width:0;height:0}

html.dark{
  --navy:#0e1726; --navy-2:#16243f;
  --forest:#7fc98e; --forest-2:#6bbf7a; --leaf:#5bbf6e; --leaf-soft:#1f2e23;

  --bone:#13171a; --bone-2:#1b2228; --card:#1b2228; --ink:#eef2ef; --ink-soft:#9fb0a6;
  --line:#2b343a; --shadow:0 10px 30px -12px rgba(0,0,0,.6); --shadow-sm:0 4px 14px -8px rgba(0,0,0,.6);
}
html.dark body{background:var(--bone);color:var(--ink)}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
'use strict'
var root = document.getElementById('root')
var sb = null
var S = { lang: (localStorage.getItem('wgad_lang') || 'sw'), dark: localStorage.getItem('wgad_dark') === '1', view: 'welcome', session: null, profile: null, isAdmin: false }
var AUTH = { mode: 'login' }
var AD = {
  title: '', description: '', cta: '',
  videoFile: null, videoObjectUrl: null, videoDuration: 0, trimStart: 0, trimEnd: 0,
  plan: null,
  payMethod: 'mobile_money', payProvider: 'M-Pesa', payPhone: '', bankName: '', refNumber: '', receiptFile: null,
  org: { name: '', email: '', whatsapp: '', contact: '', country: 'TZ', region: '', address: '', website: '', creatorName: '', creatorEmail: '', category: '' },
  agree: false,
  campaignId: null, campaignCode: null,
}

function t(k) { var d = window.DICT[S.lang] || window.DICT.sw; var v = d[k]; return v === undefined ? k : v }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c] }) }
function $(sel) { return document.querySelector(sel) }
function toast(msg) { var box = document.getElementById('toast'); var d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; box.appendChild(d); setTimeout(function () { d.remove() }, 2600) }
function showErr(msg) { var b = document.getElementById('errbar'); b.textContent = msg; b.className = 'show'; setTimeout(function () { b.className = '' }, 6000); console.error(msg) }
function spinner() { return '<div class="spin"></div>' }
function empty(emoji, text) { return '<div class="empty fade-in"><div class="em">' + emoji + '</div><p class="muted" style="margin-top:12px">' + esc(text) + '</p></div>' }
function field(label, inner) { return '<div class="field"><label>' + esc(label) + '</label>' + inner + '</div>' }
function money(amount, cur) { return cur + ' ' + Number(amount || 0).toLocaleString() }
function applyTheme() { document.documentElement.classList.toggle('dark', S.dark) }
function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms) }) }
function ic(name) {
  var M = { back: '←', check: '✓', sun: '☀', moon: '☾', cash: '💳', org: '🏢' }
  return M[name] || ''
}

/* ---------------- BOOT ---------------- */
async function boot() {
  applyTheme()
  if (!window.supabase) { showErr('Supabase library failed to load.'); return }
  sb = window.supabase.createClient(window.CFG.SUPABASE_URL, window.CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } })
  sb.auth.onAuthStateChange(function (_e, session) { S.session = session })
  try { var res = await sb.auth.getSession(); S.session = res.data.session } catch (e) {}
  await refreshProfile()
  render()
}
async function refreshProfile() {
  S.profile = null; S.isAdmin = false
  if (!S.session) return
  try {
    var r = await sb.from('profiles').select('id, full_name, role').eq('id', S.session.user.id).maybeSingle()
    S.profile = r.data || { id: S.session.user.id, full_name: S.session.user.email }
    var a = await sb.rpc('wg_is_ad_admin')
    S.isAdmin = !!(a.data)
  } catch (e) {}
}

/* ---------------- RENDER ROUTER ---------------- */
function render() {
  if (S.view === 'welcome') return screenWelcome()
  if (S.view === 'create') return screenCreate()
  if (S.view === 'editor') return screenEditor()
  if (S.view === 'audience') return screenAudience()
  if (S.view === 'payment') return screenPayment()
  if (S.view === 'org') return screenOrg()
  if (S.view === 'review') return screenReview()
  if (S.view === 'submitting') return screenSubmitting()
  if (S.view === 'success') return screenSuccess()
  if (S.view === 'dashboard') return screenDashboard()
  if (S.view === 'admin') return screenAdmin()
}
function topbar(showBack, title) {
  return '<div class="topbar">' +
    (showBack ? '<button class="icon-btn" data-act="wiz-back">' + ic('back') + '</button>' : '<div class="brand"><span style="font-size:20px">🌾</span> WeAgri Ad Center</div>') +
    '<span class="muted" style="font-weight:700;font-size:13px">' + (title || '') + '</span>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="icon-btn" data-act="toggle-theme">' + (S.dark ? ic('sun') : ic('moon')) + '</button>' +
    (S.session ? '<button class="icon-btn" data-act="goto-dash">📊</button>' : '') +
    '</div></div>'
}
function steps(stepIdx, total) {
  var html = '<div class="steps">'
  for (var i = 0; i < total; i++) html += '<div class="seg ' + (i < stepIdx ? 'done' : i === stepIdx ? 'cur' : '') + '"><i></i></div>'
  return html + '</div>'
}

/* ---------------- WELCOME / LANGUAGE / AUTH ---------------- */
function screenWelcome() {
  if (S.session) { renderWelcomeBack(); return }
  renderWelcomeHero()
}
function isEmbedded() { try { return window.self !== window.top } catch (e) { return true } }
function returnLinkHtml(style) {
  var label = ic('back') + ' ' + t('returnToSite')
  if (isEmbedded()) return '<button data-act="close-embed" style="background:none;' + style + '">' + label + '</button>'
  return '<a href="' + esc(window.CFG.MAIN_SITE_URL) + '" style="' + style + '">' + label + '</a>'
}
function renderWelcomeBack() {
  root.innerHTML = '<div class="hero-bg"><div class="hero-blob"></div><div class="page-pad fade-in" style="display:flex;flex-direction:column;min-height:100vh;justify-content:center;position:relative;z-index:2">' +
    '<div class="wrap glass" style="padding:40px 30px">' +
    '<div class="center">' +
    '<div style="font-size:44px">🌾</div>' +
    '<h1 style="font-size:28px;color:#fff;margin-top:10px">' + t('welcomeBack') + (S.profile ? ', ' + esc((S.profile.full_name || '').split(' ')[0]) : '') + '</h1>' +
    '<p style="color:rgba(255,255,255,.75);margin-top:8px;font-size:14.5px">' + esc(t('welcomeSub')) + '</p>' +
    '</div>' +
    '<button class="btn btn-grad" style="margin-top:30px" data-act="go-create">' + t('getStarted') + '</button>' +
    '<button class="btn btn-ghost" style="margin-top:10px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff" data-act="goto-dash">' + t('dashTitle') + '</button>' +
    (S.isAdmin ? '<button class="btn btn-ghost" style="margin-top:10px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff" data-act="goto-admin">' + t('adminQueue') + '</button>' : '') +
    '<button class="btn" style="margin-top:18px;color:rgba(255,255,255,.6);font-size:13px" data-act="logout">' + t('logout') + '</button>' +
    '<p class="center" style="margin-top:8px">' + returnLinkHtml('color:rgba(255,255,255,.6);font-size:13px;text-decoration:underline') + '</p>' +
    '</div></div></div>'
}
function renderWelcomeHero() {
  root.innerHTML = '<div class="hero-bg"><div class="hero-blob"></div><div class="page-pad fade-in" style="display:flex;flex-direction:column;min-height:100vh;justify-content:center;position:relative;z-index:2">' +
    '<p class="center" style="margin-bottom:14px">' + returnLinkHtml('color:rgba(255,255,255,.65);font-size:13px;font-weight:700;text-decoration:underline') + '</p>' +
    '<div class="wrap center" style="margin-bottom:26px">' +
    '<div class="pop" style="font-size:54px">🌾</div>' +
    '<h1 style="font-size:32px;color:#fff;margin-top:14px;max-width:480px;margin-inline:auto">' + esc(t('welcomeTitle')) + '</h1>' +
    '<p style="color:rgba(255,255,255,.78);margin-top:12px;max-width:440px;margin-inline:auto;font-size:15px">' + esc(t('welcomeSub')) + '</p>' +
    '</div>' +
    '<div class="wrap" style="margin-bottom:18px"><div class="lang-list">' +
    langRow('en', '🇬🇧', 'EN', t('continueEn')) +
    langRow('sw', '🇹🇿', 'SW', t('continueSw')) +
    '</div></div>' +
    '<div class="wrap glass" id="authbox" style="padding:36px 30px"></div>' +
    '</div></div></div>'
  renderAuthBox()
}
function langRow(code, flag, label, sub) {
  var sel = S.lang === code
  return '<button class="glass pop lang-item" data-act="set-lang" data-v="' + code + '" style="color:#fff">' +
    '<span class="flag">' + flag + '</span>' +
    '<span class="label"><b>' + esc(label) + '</b><span class="sub">' + esc(sub) + '</span></span>' +
    (sel ? '<span class="check">' + ic('check') + '</span>' : '') +
    '</button>'
}
function renderAuthBox() {
  var box = document.getElementById('authbox'); if (!box) return
  box.innerHTML =
    '<div class="field"><label style="color:rgba(255,255,255,.75)">' + t('email') + '</label><input class="input input-lg" id="a_email" type="email"></div>' +
    '<div class="field"><label style="color:rgba(255,255,255,.75)">' + t('password') + '</label><input class="input input-lg" id="a_pw" type="password"></div>' +
    '<div id="autherr" style="color:#ffb3a0;font-size:13px;margin-bottom:10px"></div>' +
    '<button class="btn btn-grad" data-act="do-auth">' + (AUTH.mode === 'login' ? t('login') : t('signup')) + '</button>' +
    '<p class="center" style="margin-top:14px;color:rgba(255,255,255,.7);font-size:13.5px">' + (AUTH.mode === 'login' ? t('noAccount') : t('haveAccount')) +
    ' <button data-act="auth-toggle" style="color:#fff;font-weight:800;text-decoration:underline">' + (AUTH.mode === 'login' ? t('signup') : t('login')) + '</button></p>'
}
async function doAuth() {
  var email = ($('#a_email') || {}).value || ''
  var pw = ($('#a_pw') || {}).value || ''
  var errBox = document.getElementById('autherr')
  if (!email || !pw) { if (errBox) errBox.textContent = t('fieldRequired'); return }
  try {
    var res = AUTH.mode === 'login' ? await sb.auth.signInWithPassword({ email: email, password: pw }) : await sb.auth.signUp({ email: email, password: pw })
    if (res.error) throw res.error
    S.session = res.data.session
    await refreshProfile()
    render()
  } catch (e) { if (errBox) errBox.textContent = e.message || String(e) }
}
async function logout() { try { await sb.auth.signOut() } catch (e) {} S.session = null; S.profile = null; S.isAdmin = false; S.view = 'welcome'; render() }

/* ---------------- STEP 1: CREATE AD ---------------- */
function screenCreate() {
  root.innerHTML = '<div class="app-shell">' + topbar(false, '1 / 6') + '<div class="page-pad fade-in"><div class="wrap">' +
    steps(0, 6) +
    '<h2 style="font-size:25px">' + t('createTitle') + '</h2>' +
    '<p class="muted" style="margin:8px 0 22px;font-size:14.5px">' + esc(t('createDesc')) + '</p>' +
    field(t('adTitle'), '<input class="input" id="f_title" value="' + esc(AD.title) + '">') +
    field(t('shortDesc'), '<textarea class="textarea" id="f_desc">' + esc(AD.description) + '</textarea>') +
    field(t('cta'), '<input class="input" id="f_cta" value="' + esc(AD.cta) + '" placeholder="' + esc(t('cta')) + '">') +
    '<div class="field"><label>' + t('uploadVideo') + '</label><div id="dropzone"></div></div>' +
    '<p class="muted" style="font-size:12.5px;margin:-8px 0 20px">💡 ' + esc(t('perfTip')) + '</p>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-ghost" data-act="go-welcome">' + t('cancel') + '</button>' +
    '<button class="btn btn-primary" data-act="create-next">' + t('continue') + '</button></div>' +
    '</div></div></div>'
  renderDropzone()
}
function renderDropzone() {
  var dz = document.getElementById('dropzone'); if (!dz) return
  if (AD.videoObjectUrl) {
    dz.innerHTML = '<div class="card" style="padding:14px;display:flex;gap:14px;align-items:center">' +
      '<video src="' + AD.videoObjectUrl + '" style="width:96px;height:72px;border-radius:10px;object-fit:cover;background:#000" muted></video>' +
      '<div style="flex:1"><b style="font-size:13.5px">' + esc(AD.videoFile ? AD.videoFile.name : 'video.mp4') + '</b><div class="muted" style="font-size:12px;margin-top:3px">' + (AD.videoDuration ? Math.round(AD.videoDuration) + 's' : '') + '</div></div>' +
      '<button class="btn btn-ghost btn-sm" data-act="remove-video">' + t('cancel') + '</button></div>'
    return
  }
  dz.innerHTML = '<div class="dropzone" id="dzInner"><div style="font-size:30px">⬆️</div>' +
    '<p style="font-weight:700;margin-top:8px">' + esc(t('dropHint')) + '</p><p class="muted" style="font-size:12px;margin-top:6px">' + esc(t('formats')) + '</p>' +
    '<input type="file" id="videoInput" accept="video/mp4,video/quicktime,video/x-msvideo,.mp4,.mov,.avi" style="display:none">' +
    '</div>'
  var inp = document.getElementById('videoInput')
  var inner = document.getElementById('dzInner')
  inner.addEventListener('click', function () { inp.click() })
  inner.addEventListener('dragover', function (e) { e.preventDefault(); inner.classList.add('drag') })
  inner.addEventListener('dragleave', function () { inner.classList.remove('drag') })
  inner.addEventListener('drop', function (e) { e.preventDefault(); inner.classList.remove('drag'); if (e.dataTransfer.files[0]) handleVideoFile(e.dataTransfer.files[0]) })
  inp.addEventListener('change', function () { if (inp.files[0]) handleVideoFile(inp.files[0]) })
}
function handleVideoFile(file) {
  if (!/^video\//.test(file.type) && !/\.(mp4|mov|avi)$/i.test(file.name)) { toast(t('notAVideo')); return }
  if (file.size > window.CFG.MAX_VIDEO_MB * 1024 * 1024) { toast(t('fileTooLarge')); return }
  AD.videoFile = file
  AD.videoObjectUrl = URL.createObjectURL(file)
  var probe = document.createElement('video')
  probe.preload = 'metadata'
  probe.src = AD.videoObjectUrl
  probe.onloadedmetadata = function () {
    AD.videoDuration = probe.duration || 0
    AD.trimStart = 0; AD.trimEnd = AD.videoDuration
    renderDropzone()
  }
}
function createNext() {
  AD.title = ($('#f_title') || {}).value || ''
  AD.description = ($('#f_desc') || {}).value || ''
  AD.cta = ($('#f_cta') || {}).value || ''
  if (!AD.title.trim() || !AD.description.trim() || !AD.cta.trim()) { toast(t('fieldRequired')); return }
  if (!AD.videoFile) { toast(t('videoRequired')); return }
  if (!S.session) { S.view = 'welcome'; render(); toast(t('login')); return }
  S.view = 'editor'; render()
}

/* ---------------- STEP 2: VIDEO EDITOR ---------------- */
function screenEditor() {
  var dur = AD.videoDuration || 0
  var tooLong = dur > window.CFG.MAX_VIDEO_SECONDS
  root.innerHTML = '<div class="app-shell">' + topbar(true, '2 / 6') + '<div class="page-pad fade-in"><div class="wrap">' +
    steps(1, 6) +
    '<h2 style="font-size:25px">' + t('editorTitle') + '</h2>' +
    '<div class="card" style="padding:14px;margin-top:18px"><video id="prevVid" src="' + AD.videoObjectUrl + '" style="width:100%;border-radius:14px;background:#000;max-height:320px" controls></video></div>' +
    '<div id="trimBox"></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:10px" class="muted">' +
    '<span>' + t('duration') + ': <b id="durVal" style="color:var(--ink)">' + fmtTime(AD.trimEnd - AD.trimStart) + '</b></span>' +
    '<span>' + t('remaining') + ': <b id="remVal" style="color:var(--ink)">' + fmtTime(Math.max(0, window.CFG.MAX_VIDEO_SECONDS - (AD.trimEnd - AD.trimStart))) + '</b></span></div>' +
    '<div id="lengthNotice">' + lengthNoticeHtml(tooLong) + '</div>' +
    '<button class="btn btn-primary" style="margin-top:22px" id="editorNext" data-act="editor-next" ' + (tooLong ? 'disabled' : '') + '>' + t('continue') + '</button>' +
    '</div></div></div>'
  renderTrim()
}
function lengthNoticeHtml(tooLong) {
  return tooLong
    ? '<div style="background:var(--clay-soft);margin-top:16px;padding:12px;border-radius:14px"><b style="color:var(--clay)">⚠ ' + esc(t('tooLong')) + '</b></div>'
    : '<div style="background:var(--leaf-soft);margin-top:16px;padding:12px;border-radius:14px;font-size:13px">💡 ' + esc(t('recommend')) + '</div>'
}
function fmtTime(s) { s = Math.max(0, Math.round(s || 0)); var m = Math.floor(s / 60); var r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r }
var FILM = { thumbs: null, forUrl: null }
var FILM_COUNT = 10

function renderTrim() {
  var box = document.getElementById('trimBox'); if (!box) return
  var dur = AD.videoDuration || 1
  box.innerHTML = '<div class="filmstrip-outer"><div class="filmstrip-inner" id="fsInner"><div class="skel" style="width:100%;height:100%;border-radius:12px"></div></div></div>' +
    '<div class="trim-readout"><span class="muted">' + t('trimStartLabel') + ': <b id="fsStartVal" style="color:var(--ink)">' + fmtTime(AD.trimStart) + '</b></span><span class="muted">' + t('trimEndLabel') + ': <b id="fsEndVal" style="color:var(--ink)">' + fmtTime(AD.trimEnd) + '</b></span></div>' +
    '<p class="muted center" style="font-size:12px;margin-top:10px">👆 ' + esc(t('dragToTrim')) + '</p>'
  loadFilmstrip(dur)
}
async function loadFilmstrip(dur) {
  if (FILM.forUrl !== AD.videoObjectUrl) { FILM.thumbs = null; FILM.forUrl = AD.videoObjectUrl }
  if (!FILM.thumbs) FILM.thumbs = await generateFilmstrip(AD.videoObjectUrl, dur)
  buildFilmstripDom(dur)
}
function generateFilmstrip(url, duration) {
  return new Promise(function (resolve) {
    if (!url || !duration) { resolve([]); return }
    var vid = document.createElement('video')
    vid.muted = true; vid.playsInline = true; vid.preload = 'auto'; vid.src = url
    var canvas = document.createElement('canvas')
    canvas.width = 90; canvas.height = 64
    var ctx = canvas.getContext('2d')
    function seekTo(time) {
      return new Promise(function (res) {
        function onSeeked() { vid.removeEventListener('seeked', onSeeked); res() }
        vid.addEventListener('seeked', onSeeked)
        try { vid.currentTime = time } catch (e) { res() }
      })
    }
    vid.addEventListener('error', function () { resolve([]) })
    vid.addEventListener('loadedmetadata', function () {
      (async function () {
        var thumbs = []
        try {
          for (var i = 0; i < FILM_COUNT; i++) {
            var time = Math.min(duration - 0.05, Math.max(0, (duration * (i + 0.5)) / FILM_COUNT))
            await seekTo(time)
            var vw = vid.videoWidth || 16, vh = vid.videoHeight || 9
            var scale = Math.max(canvas.width / vw, canvas.height / vh)
            var dw = vw * scale, dh = vh * scale
            ctx.clearRect(0, 0, canvas.width, canvas.height)
            ctx.drawImage(vid, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh)
            thumbs.push(canvas.toDataURL('image/jpeg', 0.55))
          }
        } catch (e) {}
        resolve(thumbs)
      })()
    })
  })
}
function buildFilmstripDom(dur) {
  var inner = document.getElementById('fsInner'); if (!inner) return
  var thumbs = FILM.thumbs || []
  inner.innerHTML = thumbs.map(function (src) { return '<div class="frame" style="background-image:url(' + src + ')"></div>' }).join('')
  var outer = inner.parentElement
  Array.prototype.forEach.call(outer.querySelectorAll('.fs-dim, .fs-selection, .fs-handle'), function (el) { el.remove() })

  var dimLeft = document.createElement('div'); dimLeft.className = 'fs-dim'; dimLeft.id = 'fsDimLeft'
  var dimRight = document.createElement('div'); dimRight.className = 'fs-dim'; dimRight.id = 'fsDimRight'
  var sel = document.createElement('div'); sel.className = 'fs-selection'; sel.id = 'fsSel'
  var hStart = document.createElement('div'); hStart.className = 'fs-handle'; hStart.id = 'fsHStart'
  hStart.innerHTML = '<div class="grip"><i></i><i></i></div>'
  var hEnd = document.createElement('div'); hEnd.className = 'fs-handle'; hEnd.id = 'fsHEnd'
  hEnd.innerHTML = '<div class="grip"><i></i><i></i></div>'
  outer.appendChild(dimLeft); outer.appendChild(dimRight); outer.appendChild(sel); outer.appendChild(hStart); outer.appendChild(hEnd)

  attachHandleDrag(hStart, 'start', outer, dur)
  attachHandleDrag(hEnd, 'end', outer, dur)
  positionFilmstripOverlay(dur)
}
function positionFilmstripOverlay(dur) {
  var outer = document.querySelector('.filmstrip-outer'); if (!outer) return
  var pad = 14
  var trackWidth = Math.max(1, outer.clientWidth - pad * 2)
  var leftPx = pad + (AD.trimStart / dur) * trackWidth
  var rightPx = pad + (AD.trimEnd / dur) * trackWidth
  var dimLeft = document.getElementById('fsDimLeft')
  var dimRight = document.getElementById('fsDimRight')
  var sel = document.getElementById('fsSel')
  var hStart = document.getElementById('fsHStart')
  var hEnd = document.getElementById('fsHEnd')
  if (dimLeft) { dimLeft.style.left = pad + 'px'; dimLeft.style.width = Math.max(0, leftPx - pad) + 'px' }
  if (dimRight) { dimRight.style.left = rightPx + 'px'; dimRight.style.width = Math.max(0, (outer.clientWidth - pad) - rightPx) + 'px' }
  if (sel) { sel.style.left = leftPx + 'px'; sel.style.width = Math.max(0, rightPx - leftPx) + 'px' }
  if (hStart) hStart.style.left = leftPx + 'px'
  if (hEnd) hEnd.style.left = rightPx + 'px'
  var sv = document.getElementById('fsStartVal'); if (sv) sv.textContent = fmtTime(AD.trimStart)
  var ev = document.getElementById('fsEndVal'); if (ev) ev.textContent = fmtTime(AD.trimEnd)
}
function attachHandleDrag(handle, which, outer, dur) {
  function clientXOf(ev) {
    if (ev.clientX != null) return ev.clientX
    if (ev.touches && ev.touches[0]) return ev.touches[0].clientX
    if (ev.changedTouches && ev.changedTouches[0]) return ev.changedTouches[0].clientX
    return 0
  }
  function onMove(ev) {
    if (ev.cancelable) ev.preventDefault()
    var pad = 14
    var rect = outer.getBoundingClientRect()
    var trackWidth = Math.max(1, rect.width - pad * 2)
    var pct = Math.min(1, Math.max(0, (clientXOf(ev) - rect.left - pad) / trackWidth))
    var val = pct * dur
    if (which === 'start') {
      AD.trimStart = Math.min(val, AD.trimEnd - 0.5)
      if (AD.trimStart < 0) AD.trimStart = 0
    } else {
      AD.trimEnd = Math.max(val, AD.trimStart + 0.5)
      if (AD.trimEnd > dur) AD.trimEnd = dur
    }
    positionFilmstripOverlay(dur)
    updateDurationLabels()
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove)
    document.removeEventListener('pointerup', onUp)
    document.removeEventListener('pointercancel', onUp)
    document.removeEventListener('mousemove', onMove)
    document.removeEventListener('mouseup', onUp)
    document.removeEventListener('touchmove', onMove)
    document.removeEventListener('touchend', onUp)
    document.removeEventListener('touchcancel', onUp)
  }
  function onDown(e) {
    e.preventDefault()
    try { if (e.pointerId != null && handle.setPointerCapture) handle.setPointerCapture(e.pointerId) } catch (err) {}
    // listen on the DOCUMENT, not the (small) handle itself — this is what keeps the
    // drag tracking the pointer even after it moves off the 22px handle hit-box.
    document.addEventListener('pointermove', onMove)
    document.addEventListener('pointerup', onUp)
    document.addEventListener('pointercancel', onUp)
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
    document.addEventListener('touchmove', onMove, { passive: false })
    document.addEventListener('touchend', onUp)
    document.addEventListener('touchcancel', onUp)
  }
  handle.addEventListener('pointerdown', onDown)
  handle.addEventListener('mousedown', onDown)
  handle.addEventListener('touchstart', onDown, { passive: false })
}

  if (S.view === 'editor' && document.getElementById('fsInner')) positionFilmstripOverlay(AD.videoDuration || 1)

  var tooLong = span > window.CFG.MAX_VIDEO_SECONDS

async function submitAd() {
  if (!AD.agree) { toast(t('fieldRequired')); return }
  if (!S.session) { toast(t('errOccurred')); return }
  S.view = 'submitting'; render()
  try {
    setSubmitStage('upload')
    var path = 'campaigns/' + S.session.user.id + '/' + Date.now() + '_' + (AD.videoFile.name || 'video.mp4').replace(/[^a-zA-Z0-9_.-]/g, '_')
    var up = await sb.storage.from('ad-videos').upload(path, AD.videoFile, { upsert: false })
    if (up.error) throw up.error

    setSubmitStage('processing')
    /* Ensure advertiser row exists — prevents videos_advertiser_id_fkey violation */
    try { await sb.from('advertisers').upsert({id:S.session.user.id,email:(S.session.user.email||'')},{onConflict:'id',ignoreDuplicates:true}) } catch(_ae){}
    var vIns = await sb.from('videos').insert({
      advertiser_id: S.session.user.id, storage_path: path, format: AD.videoFile.type,
      file_size_bytes: AD.videoFile.size, duration_seconds: AD.videoDuration, trim_start: AD.trimStart, trim_end: AD.trimEnd,
    }).select().single()
    if (vIns.error) throw vIns.error

    var oIns = await sb.from('organizations').insert({
      owner_id: S.session.user.id, name: AD.org.name, official_email: AD.org.email, whatsapp_number: AD.org.whatsapp,
      contact_number: AD.org.contact || null, country: AD.org.country, region: AD.org.region || null,
      address: AD.org.address || null, website: AD.org.website || null, business_category: AD.org.category || null,
      creator_name: AD.org.creatorName, creator_email: AD.org.creatorEmail,
    }).select().single()
    if (oIns.error) throw oIns.error

    var cIns = await sb.from('campaigns').insert({
      advertiser_id: S.session.user.id, organization_id: oIns.data.id, video_id: vIns.data.id,
      title: AD.title, description: AD.description, call_to_action: AD.cta,
      audience_plan: AD.plan, language: S.lang, status: 'submitted', submitted_at: new Date().toISOString(),
    }).select().single()
    if (cIns.error) throw cIns.error
    AD.campaignId = cIns.data.id; AD.campaignCode = cIns.data.campaign_code

    await sb.from('audience_preferences').insert({ campaign_id: cIns.data.id, target_roles: planRoles(AD.plan), target_countries: [AD.org.country], target_regions: AD.org.region ? [AD.org.region] : [] })

    var P = window.PLANS[AD.plan]
    var cur = (window.COUNTRIES.find(function (c) { return c.code === AD.org.country }) || {}).currency || 'TZS'
    var subIns = await sb.from('subscriptions').insert({ campaign_id: cIns.data.id, plan: AD.plan, amount_usd: P.usd, amount_local: P.tzs, currency: cur, duration_days: 30 }).select().single()

    var receiptUrl = null
    if (AD.payMethod === 'bank_transfer' && AD.receiptFile) {
      var rpath = 'receipts/' + S.session.user.id + '/' + Date.now() + '_' + AD.receiptFile.name.replace(/[^a-zA-Z0-9_.-]/g, '_')
      var rup = await sb.storage.from('ad-receipts').upload(rpath, AD.receiptFile)
      if (!rup.error) receiptUrl = rpath
    }
    var payIns = await sb.from('payments').insert({
      campaign_id: cIns.data.id, subscription_id: subIns.data ? subIns.data.id : null, method: AD.payMethod,
      provider: AD.payMethod === 'mobile_money' ? AD.payProvider : AD.bankName,
      phone_number: AD.payMethod === 'mobile_money' ? AD.payPhone : null,
      reference_number: AD.payMethod === 'bank_transfer' ? AD.refNumber : null,
      receipt_url: receiptUrl, amount: P.usd, currency: 'USD',
    }).select().single()
    if (!payIns.error) {
      await sb.from('transactions').insert({ payment_id: payIns.data.id, type: 'charge', amount: P.usd, currency: 'USD', status: 'pending' })
    }

    setSubmitStage('review')
    await sleep(900)
    setSubmitStage('done')
    await sleep(500)
    S.view = 'success'; render()
  } catch (e) {
    showErr(e.message || String(e))
    S.view = 'review'; render()
  }
}

    '<div class="success-ring"><span style="font-size:46px;color:var(--forest)">✓</span></div>' +
    '<h2 style="font-size:24px">' + esc(t('successTitle')) + '</h2>' +
    '<p class="muted" style="margin:10px 0 4px">' + esc(t('successMsg')) + '</p>' +
    '<p class="muted" style="font-size:13px">' + esc(t('reviewTime')) + '</p>' +
    (AD.campaignCode ? '<p style="margin-top:14px;font-weight:700">' + esc(AD.campaignCode) + '</p>' : '') +
    '<button class="btn btn-primary" style="margin-top:26px" data-act="goto-dash">' + t('returnDash') + '</button>' +
    '<button class="btn btn-ghost" style="margin-top:10px" data-act="create-another">' + t('createAnother') + '</button>' +
    '</div></div></div>'
}

/* ---------------- DASHBOARD ---------------- */
function screenDashboard() {
  root.innerHTML = '<div class="app-shell">' + topbar(true, t('dashTitle')) + '<div class="page-pad fade-in"><div class="wrap-wide">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 style="font-size:24px">' + t('dashTitle') + '</h2>' +
    '<button class="btn btn-primary btn-sm" data-act="create-another">+ ' + t('newCampaign') + '</button></div>' +
    '<div id="dashList">' + spinner() + '</div></div></div></div>'
  loadDashboard()
}
async function loadDashboard() {
  var box = document.getElementById('dashList'); if (!box || !S.session) return
  try {
    var r = await sb.from('campaigns').select('*, organizations(name)').eq('advertiser_id', S.session.user.id).order('created_at', { ascending: false })
    if (r.error) throw r.error
    var list = r.data || []
    if (!list.length) { box.innerHTML = empty('📢', t('noCampaigns')); return }
    var ids = list.map(function (c) { return c.id })
    var an = ids.length ? await sb.from('analytics').select('campaign_id, views, clicks').in('campaign_id', ids) : { data: [] }
    var agg = {}
    ;(an.data || []).forEach(function (row) {
      var a = agg[row.campaign_id] || { views: 0, clicks: 0 }
      a.views += row.views || 0; a.clicks += row.clicks || 0
      agg[row.campaign_id] = a
    })
    box.innerHTML = list.map(function (c) { return campaignCard(c, agg[c.id] || { views: 0, clicks: 0 }) }).join('')
  } catch (e) { box.innerHTML = empty('⚠️', e.message || t('errOccurred')) }
}
function campaignCard(c, stats) {
  var ctr = stats.views ? ((stats.clicks / stats.views) * 100).toFixed(1) + '%' : '0%'
  var canPause = c.status === 'live'
  var canResume = c.status === 'paused'
  var canEdit = c.status === 'draft' || c.status === 'rejected'
  return '<div class="card" style="padding:18px;margin-bottom:14px">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
    '<div><b style="font-size:15.5px">' + esc(c.title) + '</b><div class="muted" style="font-size:12px;margin-top:3px">' + esc(c.campaign_code || '') + ' · ' + esc(c.organizations ? c.organizations.name : '') + '</div></div>' +
    '<span class="status-chip st-' + c.status + '">' + esc((window.DICT[S.lang].statusLabels || {})[c.status] || c.status) + '</span></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px">' +
    statBox(t('views'), stats.views) + statBox(t('clicks'), stats.clicks) + statBox(t('ctr'), ctr) +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">' +
    (canPause ? '<button class="btn btn-ghost btn-sm" data-act="camp-status" data-id="' + c.id + '" data-v="paused">' + t('pauseCampaign') + '</button>' : '') +
    (canResume ? '<button class="btn btn-primary btn-sm" data-act="camp-status" data-id="' + c.id + '" data-v="live">' + t('resumeCampaign') + '</button>' : '') +
    '<button class="btn btn-ghost btn-sm" data-act="camp-duplicate" data-id="' + c.id + '">' + t('duplicateCampaign') + '</button>' +
    (canEdit ? '<button class="btn btn-ghost btn-sm" data-act="camp-edit" data-id="' + c.id + '">' + t('editCampaign') + '</button>' : '') +
    '<button class="btn btn-ghost btn-sm" data-act="camp-pdf" data-id="' + c.id + '">' + t('downloadPdf') + '</button>' +
    '</div></div>'
}
function statBox(label, val) { return '<div class="stat" style="background:var(--bone-2)"><div class="v">' + esc(val) + '</div><div class="l">' + esc(label) + '</div></div>' }

async function setCampaignStatus(id, status) {
  try {
    if (S.session && S.session.user) {
      try { await sb.from('advertisers').upsert({id:S.session.user.id,email:(S.session.user.email||'')},{onConflict:'id',ignoreDuplicates:true}) } catch(_ae){}
    }
    await sb.from('campaigns').update({ status: status }).eq('id', id)
    toast(t('saved')); loadDashboard()
  } catch (e) { showErr(e.message) }
}
async function duplicateCampaign(id) {
  try {
    var r = await sb.from('campaigns').select('*').eq('id', id).maybeSingle()
    if (!r.data) return
    var c = r.data
    await sb.from('campaigns').insert({
      advertiser_id: c.advertiser_id, organization_id: c.organization_id, video_id: c.video_id,
      title: c.title + ' (copy)', description: c.description, call_to_action: c.call_to_action,
      audience_plan: c.audience_plan, language: c.language, status: 'draft',
    })
    toast(t('saved')); loadDashboard()
  } catch (e) { showErr(e.message) }
}
function downloadCampaignPdf(id) {
  var w = window.open('', '_blank'); if (!w) { toast('Pop-up blocked'); return }
  w.document.write('<!doctype html><html><head><title>Campaign report</title><style>body{font-family:sans-serif;padding:40px}h1{color:#1f3d2b}</style></head><body>' +
    '<h1>WeAgri Ad Center — Campaign Report</h1><p>Campaign ID: ' + esc(id) + '</p><p>Generated: ' + new Date().toLocaleString() + '</p>' +
    '<p style="color:#777;font-size:13px">Use your browser&rsquo;s &ldquo;Save as PDF&rdquo; option in the print dialog to save this report.</p>' +
    '<script>window.onload=function(){window.print()}<\/script></body></html>')
  w.document.close()
}

/* ---------------- ADMIN QUEUE ---------------- */
function screenAdmin() {
  if (!S.isAdmin) { root.innerHTML = '<div class="app-shell">' + topbar(true, '') + '<div class="page-pad">' + empty('🔒', t('notAdmin')) + '</div></div>'; return }
  root.innerHTML = '<div class="app-shell">' + topbar(true, t('adminQueue')) + '<div class="page-pad fade-in"><div class="wrap-wide">' +
    '<h2 style="font-size:24px;margin-bottom:18px">' + t('adminQueue') + '</h2>' +
    '<div id="adminList">' + spinner() + '</div></div></div></div>'
  loadAdminQueue()
}
async function loadAdminQueue() {
  var box = document.getElementById('adminList'); if (!box) return
  try {
    var r = await sb.from('campaigns').select('*, organizations(name, official_email, whatsapp_number), videos(storage_path, duration_seconds)').in('status', ['submitted', 'processing', 'in_review']).order('created_at', { ascending: true })
    if (r.error) throw r.error
    var list = r.data || []
    if (!list.length) { box.innerHTML = empty('✅', t('noPending')); return }
    box.innerHTML = list.map(adminCard).join('')
  } catch (e) { box.innerHTML = empty('⚠️', e.message || t('errOccurred')) }
}
function adminCard(c) {
  var videoUrl = c.videos ? sb.storage.from('ad-videos').getPublicUrl(c.videos.storage_path).data.publicUrl : ''
  return '<div class="card" style="padding:18px;margin-bottom:14px">' +
    '<div style="display:flex;justify-content:space-between;gap:10px"><b>' + esc(c.title) + '</b><span class="status-chip st-' + c.status + '">' + esc(c.campaign_code) + '</span></div>' +
    '<p class="muted" style="font-size:13px;margin:8px 0">' + esc(c.description) + '</p>' +
    (videoUrl ? '<video src="' + videoUrl + '" style="width:100%;max-height:220px;border-radius:14px;background:#000" controls></video>' : '') +
    '<div class="muted" style="font-size:12.5px;margin-top:10px">' + esc(c.organizations ? c.organizations.name : '') + ' · ' + esc(c.organizations ? c.organizations.official_email : '') + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:14px">' +
    '<button class="btn btn-primary btn-sm" data-act="admin-approve" data-id="' + c.id + '">' + t('approve') + '</button>' +
    '<button class="btn btn-clay btn-sm" data-act="admin-reject" data-id="' + c.id + '">' + t('reject') + '</button>' +
    '</div></div>'
}
async function adminApprove(id) {
  try {
    var cRow = await sb.from('campaigns').select('advertiser_id, title').eq('id', id).maybeSingle()
    /* Ensure advertiser row exists before updating campaigns (fixes FK violation) */
    if (cRow.data && cRow.data.advertiser_id) {
      try { await sb.from('advertisers').upsert({id:cRow.data.advertiser_id},{onConflict:'id',ignoreDuplicates:true}) } catch(_ae){}
    }
    await sb.from('campaigns').update({ status: 'live', approved_at: new Date().toISOString(), live_at: new Date().toISOString() }).eq('id', id)
    await sb.from('ad_reviews').insert({ campaign_id: id, reviewer_id: S.session.user.id, decision: 'approved' })
    if (cRow.data) await sb.from('notifications').insert({ recipient_id: cRow.data.advertiser_id, actor_id: S.session.user.id, type: 'ad_approved', title: 'Advertisement approved', body: '"' + cRow.data.title + '" is now live.', campaign_id: id })
    toast(t('saved')); loadAdminQueue()
  } catch (e) { showErr(e.message) }
}
async function adminReject(id) {
  var reason = prompt(t('reasonPrompt'))
  if (!reason) return
  try {
    await sb.from('campaigns').update({ status: 'rejected', rejected_at: new Date().toISOString(), rejection_reason: reason }).eq('id', id)
    await sb.from('ad_reviews').insert({ campaign_id: id, reviewer_id: S.session.user.id, decision: 'rejected', reason: reason })
    var c = await sb.from('campaigns').select('advertiser_id, title').eq('id', id).maybeSingle()
    if (c.data) await sb.from('notifications').insert({ recipient_id: c.data.advertiser_id, actor_id: S.session.user.id, type: 'ad_rejected', title: 'Advertisement requires changes', body: reason, campaign_id: id })
    toast(t('saved')); loadAdminQueue()
  } catch (e) { showErr(e.message) }
}

/* ---------------- GLOBAL CLICK ROUTER ---------------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return
  var act = el.getAttribute('data-act'); var v = el.getAttribute('data-v'); var id = el.getAttribute('data-id')
  switch (act) {
    case 'set-lang': S.lang = v; localStorage.setItem('wgad_lang', v); renderWelcomeHero(); break
    case 'toggle-theme': S.dark = !S.dark; localStorage.setItem('wgad_dark', S.dark ? '1' : '0'); applyTheme(); render(); break
    case 'auth-toggle': AUTH.mode = AUTH.mode === 'login' ? 'signup' : 'login'; renderAuthBox(); break
    case 'do-auth': doAuth(); break
    case 'close-embed': if (window.parent !== window) window.parent.postMessage('close-adcenter', '*'); break
    case 'logout': logout(); break
    case 'go-welcome': S.view = 'welcome'; render(); break
    case 'go-create': S.view = 'create'; render(); break
    case 'goto-dash': S.view = 'dashboard'; render(); break
    case 'goto-admin': S.view = 'admin'; render(); break
    case 'create-another':
      AD.title = ''; AD.description = ''; AD.cta = ''; AD.videoFile = null; AD.videoObjectUrl = null; AD.videoDuration = 0; AD.plan = null; AD.agree = false
      S.view = 'create'; render(); break
    case 'remove-video': AD.videoFile = null; AD.videoObjectUrl = null; AD.videoDuration = 0; renderDropzone(); break
    case 'create-next': createNext(); break
    case 'editor-next': editorNext(); break
    case 'pick-plan': AD.plan = v; screenAudience(); break
    case 'audience-next': audienceNext(); break
    case 'pay-method': AD.payMethod = v; screenPayment(); break
    case 'pay-provider': AD.payProvider = v; renderPayBody(); break
    case 'payment-next': paymentNext(); break
    case 'org-next': orgNext(); break
    case 'submit-ad': submitAd(); break
    case 'camp-status': setCampaignStatus(id, v); break
    case 'camp-duplicate': duplicateCampaign(id); break
    case 'camp-edit': toast(t('editCampaign')); break
    case 'camp-pdf': downloadCampaignPdf(id); break
    case 'admin-approve': adminApprove(id); break
    case 'admin-reject': adminReject(id); break
    case 'wiz-back':
      if (S.view === 'editor') S.view = 'create'
      else if (S.view === 'audience') S.view = 'editor'
      else if (S.view === 'payment') S.view = 'audience'
      else if (S.view === 'org') S.view = 'payment'
      else if (S.view === 'review') S.view = 'org'
      else if (S.view === 'dashboard' || S.view === 'admin') S.view = 'welcome'
      else S.view = 'welcome'
      render(); break
  }
})

boot()
})()
</script>
</body>
</html>
