// ── Game Changer state ────────────────────────────────────────────────
var _wgNotifTimer = null; var _wgGpsTimer = null

// ── QR URL builder ────────────────────────────────────────────────────
function wgScanUrl(trackingId, orderId) {
  var base = (window.CFG.SITE_URL || window.location.origin + '/').replace(/\/?$/, '/')
  return base + '?scan=' + encodeURIComponent(trackingId) + '&oid=' + encodeURIComponent(orderId)
}

// ── QR code generator ─────────────────────────────────────────────────
function wgMakeQR(text, cb) {
  if (window.QRCode && typeof window.QRCode.toDataURL === 'function') {
    window.QRCode.toDataURL(text, { width: 260, margin: 2, color: { dark: '#1a3d1a', light: '#ffffff' } }, function (err, url) { cb(err ? null : url) })
  } else {
    cb('https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(text))
  }
}

// ── Status label & color ──────────────────────────────────────────────
function wgStatusColor(ds) {
  return ({preparing:'#888',accepted:'#1a5c1a',in_transit:'#1565c0',picked_up:'#b45309',
    delivering:'#c2410c',awaiting_confirmation:'#7c3aed',confirmed:'#166534',delivered:'#166534'})[ds]||'#888'
}
function wgStatusLabel(ds) {
  var k = {preparing:'pending',accepted:'accepted',in_transit:'inTransit',picked_up:'pickedUp',
    delivering:'delivering',awaiting_confirmation:'awaitingConfirm',confirmed:'confirmedStatus',delivered:'orderDelivered'}
  return t(k[ds] || ds)
}

// ── Print / save QR ───────────────────────────────────────────────────
function wgPrintQR(orderId, trackingId) {
  var scanUrl = wgScanUrl(trackingId, orderId)

  function _openPrintWindow(src) {
    var html =
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>WeAgri QR<\/title>' +
      '<style>' +
        'body{font-family:Arial,sans-serif;text-align:center;padding:40px 20px;margin:0;background:#fff}' +
        'h2{color:#1a3d1a;font-size:22px;margin:0 0 4px}' +
        'p.sub{color:#666;font-size:13px;margin:0 0 22px}' +
        'img.qr{display:block;margin:0 auto 18px;padding:12px;border:1px solid #e0e0e0;border-radius:14px;background:#fff}' +
        'p.oid{font-size:15px;margin:0 0 6px}' +
        'p.url{font-size:10px;color:#999;word-break:break-all;max-width:340px;margin:0 auto 8px}' +
        'p.hint{color:#ccc;font-size:11px}' +
        '@media print{body{padding:16px}}' +
      '<\/style><\/head><body>' +
      '<h2>WeAgri Delivery QR Code<\/h2>' +
      '<p class="sub">Scan with any phone camera to track this delivery<\/p>' +
      '<img class="qr" id="pqr" src="' + src + '" width="300" height="300" ' +
        'onload="setTimeout(function(){window.focus();window.print();},200)">' +
      '<p class="oid">Order: <strong>' + orderId + '<\/strong><\/p>' +
      '<p class="url">' + scanUrl + '<\/p>' +
      '<p class="hint">WeAgri &mdash; Agricultural Marketplace<\/p>' +
      '<\/body><\/html>'
    var w = window.open('', '_blank')
    if (!w) { toast('Allow pop-ups to print the QR code'); return }
    w.document.open(); w.document.write(html); w.document.close()
  }

  // First: reuse the already-displayed QR image from the modal (fastest, no regeneration needed)
  var existing = document.getElementById('wg-qr-data')
  if (existing && existing.src && existing.naturalWidth > 0) {
    _openPrintWindow(existing.src)
    return
  }

  // Second: regenerate via wgMakeQR — handles QRCode.js library AND api.qrserver.com fallback
  toast('Generating QR...')
  wgMakeQR(scanUrl, function (src) {
    if (src) { _openPrintWindow(src) }
    else { toast('Could not generate QR. Check internet connection.') }
  })
}

// ── Handle scanned URL/text ───────────────────────────────────────────
function wgHandleScanUrl(raw) {
  var tId = null, oId = ''
  try { var url = new URL(raw); tId = url.searchParams.get('scan'); oId = url.searchParams.get('oid') || '' } catch (e) {}
  if (!tId && raw && raw.indexOf('WEAGRI|') === 0) { var p = raw.split('|'); tId = p[1]; oId = p[2] || '' }
  if (!tId) { toast('Unrecognised QR code'); return }
  wgOnQRScanned(decodeURIComponent(tId), decodeURIComponent(oId))
}

// ── Transporter: confirm pickup ───────────────────────────────────────
async function wgTransPickup(orderId, trackingId, buyerId) {
  try {
    await sb.from('orders').update({ delivery_status: 'picked_up' }).eq('id', orderId)
    notify(buyerId, 'order', S.profile.full_name + ': ' + t('pickedUp'), t('orderPickedUp'))
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function (pos) {
        sb.from('wg_tracking_locations').insert({ tracking_id: trackingId, lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }).then(function(){})
        sb.from('orders').update({ transporter_lat: pos.coords.latitude, transporter_lng: pos.coords.longitude, transporter_updated_at: new Date().toISOString() }).eq('id', orderId).then(function(){})
      }, null, { enableHighAccuracy: true, timeout: 10000 })
    }
    wgStartGPS(orderId, trackingId)
    toast(t('pickedUp')); closeSheet()
  } catch (e) { showErr(e.message) }
}

// ── Transporter: mark delivered ───────────────────────────────────────
async function wgTransDeliver(orderId, sellerId, buyerId) {
  try {
    wgStopGPS()
    await sb.from('orders').update({ delivery_status: 'awaiting_confirmation' }).eq('id', orderId)
    notify(buyerId, 'order', S.profile.full_name + ' has delivered your order. Did you receive it?', 'Open Orders tab to confirm.')
    notify(sellerId, 'order', t('orderDelivered'), t('awaitingConfirm'))
    toast(t('orderDelivered')); closeSheet()
  } catch (e) { showErr(e.message) }
}

// ── GPS: update every 5 minutes ───────────────────────────────────────
function wgStartGPS(orderId, trackingId) {
  wgStopGPS()
  function sendLoc() {
    if (!navigator.geolocation) return
    navigator.geolocation.getCurrentPosition(function (pos) {
      sb.from('wg_tracking_locations').insert({ tracking_id: trackingId, lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }).then(function(){})
      sb.from('orders').update({ transporter_lat: pos.coords.latitude, transporter_lng: pos.coords.longitude, transporter_updated_at: new Date().toISOString() }).eq('id', orderId).then(function(){})
    }, null, { enableHighAccuracy: true, timeout: 12000 })
  }
  sendLoc()
  _wgGpsTimer = setInterval(sendLoc, 5 * 60 * 1000)
  toast('GPS tracking ON')
}
function wgStopGPS() { if (_wgGpsTimer) { clearInterval(_wgGpsTimer); _wgGpsTimer = null } }

async function wgTrackOrder(orderId) {

// ── Buyer confirms receipt -> award seller points ─────────────────────
async function wgBuyerConfirm(orderId, sellerId) {
  try {
    await sb.from('orders').update({ status:'completed', delivery_status:'confirmed', buyer_confirmed:true, buyer_confirmed_at:new Date().toISOString() }).eq('id', orderId)
    REC.velocityLoaded = false // this completion may bump the seller into "Most suggested"
    var rv = await sb.from('reviews').select('rating').eq('order_id', orderId).maybeSingle()
    var stars = rv.data ? Math.min(Number(rv.data.rating), 5) : 0
    try { await sb.rpc('wg_award_points', { p_seller_id: sellerId, p_stars: stars }) } catch(e) { /* SQL not run yet — points stored locally on next read */ }
    notify(sellerId, 'order', 'Order confirmed as received by ' + S.profile.full_name + '.', 'You earned 3 points' + (stars > 0 ? ' + ' + stars + ' star rating point' + (stars > 1 ? 's' : '') : '') + '. Well done!', { order_id: orderId })
    toast(t('orderConfirmed')); closeSheet()
    setTimeout(buyerOrders, 400)
  } catch (e) { showErr(e.message) }
}

// ── Seller points panel — works with and without wg_seller_points table ─
async function wgSellerPoints() {
  openSheet(t('myPoints'), '<div style="padding:28px;text-align:center">' + wgSpinHtml() + '</div>')
  try {
    // Always calculate from source tables so existing accounts see their real points
    var [ordRes, revRes] = await Promise.all([
      sb.from('orders').select('status,total_price').eq('seller_id', S.profile.id),
      sb.from('reviews').select('rating').eq('seller_id', S.profile.id)
    ])
    var completedOrders = (ordRes.data || []).filter(function(o){ return o.status === 'completed' || o.status === 'confirmed' || o.delivery_status === 'confirmed' })
    var reviews = revRes.data || []
    var calcCompleted = completedOrders.length
    var calcStars = reviews.reduce(function(s,r){ return s + Math.min(Number(r.rating||0), 5) }, 0)
    var calcRatings = reviews.length
    var calcTotal = calcCompleted * 3 + calcStars

    // Also try the dedicated points table (set by the SQL trigger if installed)
    var pts = { total_points: calcTotal, completed_orders: calcCompleted, total_stars: calcStars, ratings_count: calcRatings }
    try {
      var pr = await sb.from('wg_seller_points').select('*').eq('seller_id', S.profile.id).maybeSingle()
      if (pr.data && pr.data.total_points > 0) {
        // Use dedicated table if it has MORE points (it accumulates over time)
        if (pr.data.total_points >= calcTotal) pts = pr.data
      }
    } catch(e) { /* table not installed yet, use calculated values above */ }

    var avg = pts.ratings_count > 0 ? (pts.total_stars / pts.ratings_count).toFixed(1) : '—'
    var compPts = (pts.completed_orders || 0) * 3
    var starPts = pts.total_stars || 0
    setSheetBody('<div style="padding:16px">' +
      '<div style="text-align:center;padding:28px 20px;background:linear-gradient(135deg,var(--forest),#2d8a2d);border-radius:20px;color:#fff;margin-bottom:20px;box-shadow:0 8px 24px rgba(26,93,26,.25)">' +
        '<div style="font-size:62px;font-weight:900;font-family:var(--display);line-height:1">' + (pts.total_points||0) + '</div>' +
        '<div style="font-size:14px;opacity:.85;margin-top:6px;font-weight:600">' + esc(t('pointsTotal')) + '</div>' +
        '<div style="font-size:12px;opacity:.65;margin-top:3px">' + esc(t('gcSource')) + '</div>' +
      '</div>' +
      '<div class="grid-2" style="gap:10px;margin-bottom:20px">' +
        stat(pts.completed_orders||0, t('completedOrders'), 'var(--leaf-soft)') +
        stat(avg === '—' ? '—' : avg + ' / 5', t('avgRating'), 'var(--maize-soft)') +
      '</div>' +
      '<h3 style="font-size:15px;margin-bottom:12px;color:var(--forest)">' + esc(t('pointsBreakdown')) + '</h3>' +
      '<div class="card" style="padding:14px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">' +
          '<div><div style="font-size:14px">' + ic('check',14) + ' ' + esc(t('completionPts')) + '</div>' +
               '<div class="muted" style="font-size:12px">' + (pts.completed_orders||0) + ' orders x 3 pts</div></div>' +
          '<b style="color:var(--forest)">' + compPts + ' pts</b>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">' +
          '<div><div style="font-size:14px">' + ic('star',14) + ' ' + esc(t('ratingPts')) + '</div>' +
               '<div class="muted" style="font-size:12px">' + (pts.ratings_count||0) + ' ratings, total ' + starPts + ' stars</div></div>' +
          '<b style="color:var(--forest)">' + starPts + ' pts</b>' +
        '</div>' +
      '</div>' +
      '<p class="muted" style="font-size:12px;text-align:center;margin-top:16px">Keep completing orders to earn more points!</p>' +
    '</div>')
  } catch (e) { showErr(e.message) }
}

// ── updateNotificationCount  (global function per spec) ──────────────
function updateNotificationCount(n) {
  var badge = document.getElementById('wg-notif-badge')
  if (!badge) { _wgRebuildBellBadge(n); return }
  if (n <= 0) { badge.style.display = 'none'; return }
  badge.style.display = 'flex'
  if (n > 99) { badge.textContent = '99+'; badge.classList.add('pill') }
  else { badge.textContent = String(n); badge.classList.remove('pill') }
}

// Inject crimson badge into the alerts bell nav icon
function _wgRebuildBellBadge(count) {
  var btn = document.querySelector('[data-tab="alerts"]'); if (!btn) return
  var navIc = btn.querySelector('.nav-ic'); if (!navIc) return
  var old = document.getElementById('wg-notif-badge'); if (old) old.remove()
  navIc.style.position = 'relative'; navIc.style.display = 'inline-flex'
  var badge = document.createElement('span')
  badge.id = 'wg-notif-badge'
  badge.className = 'wg-nb-badge' + (count > 99 ? ' pill' : '')
  badge.style.display = count > 0 ? 'flex' : 'none'
  badge.textContent = count > 99 ? '99+' : (count > 0 ? String(count) : '')
  navIc.appendChild(badge)
}

async function wgUpdateBadge() {
  if (!S.profile || !sb) return
  try {
    var r = await sb.from('notifications').select('id', { count: 'exact' })
      .eq('recipient_id', S.profile.id).eq('read', false)
    var n = r.count || 0
    if (!document.getElementById('wg-notif-badge')) _wgRebuildBellBadge(n)
    else updateNotificationCount(n)
  } catch(e) {}

async function wgBuyerPasswordConfirm(orderId, sellerId) {
  var pwdInput = document.getElementById('wg-buyer-pwd')
  var errEl = document.getElementById('wg-pwd-err')
  if (!pwdInput) return
  var pwd = pwdInput.value || ''
  if (!pwd.trim()) {
    if (errEl) errEl.textContent = 'Please enter your password.'
    pwdInput.focus(); return
  }
  if (errEl) errEl.textContent = ''
  // Disable button while verifying
  var btn = document.querySelector('[data-act="wg-pwd-confirm"]')
  if (btn) { btn.disabled = true; btn.textContent = 'Verifying...' }
  try {
    // Verify identity via Supabase auth
    var res = await sb.auth.signInWithPassword({ email: S.session.user.email, password: pwd })
    if (res.error) {
      if (errEl) errEl.textContent = 'Incorrect password. Please try again.'
      if (btn) { btn.disabled = false; btn.textContent = 'Confirm Delivered' }
      pwdInput.select(); return
    }
    // Password correct — confirm the delivery
    await wgBuyerConfirm(orderId, sellerId)
  } catch(e) {
    if (errEl) errEl.textContent = e.message || 'Verification failed. Try again.'
    if (btn) { btn.disabled = false; btn.textContent = 'Confirm Delivered' }
  }
}

  var box = document.getElementById('wg-nlist'); if (!box) return
  try {
    var r
    try {
      var q = sb.from('notifications')
        .select('*, actor:profiles!notifications_actor_id_fkey(full_name)')
        .eq('recipient_id', S.profile.id)
      q = mode === 'archive' ? q.eq('archived', true) : q.eq('archived', false)
      r = await q.order('created_at', { ascending: false }).limit(80)
      if (r.error) throw r.error
    } catch (_archErr) {
      // archived column may not exist yet (SQL not run) — load without filter
      r = await sb.from('notifications')
        .select('*, actor:profiles!notifications_actor_id_fkey(full_name)')
        .eq('recipient_id', S.profile.id)
        .order('created_at', { ascending: false }).limit(80)
    }
    var rows = r.data || []

    if (!rows.length) {
      box.innerHTML = '<div style="padding:48px 0;text-align:center">' + ic('bell',40) +
        '<p class="muted" style="margin-top:14px;font-size:14px">' + (mode === 'archive' ? 'No archived notifications' : 'All caught up') + '</p></div>'
      return
    }
    if (mode !== 'archive') {
      sb.from('notifications').update({ read: true }).eq('recipient_id', S.profile.id).eq('read', false).then(function(){}).catch(function(){})
      updateNotificationCount(0)
    }

    box.innerHTML = rows.map(function(n) {
      var actor = (n.actor && n.actor.full_name) || 'WeAgri'
      var inits = actor.split(' ').slice(0,2).map(function(w){ return (w[0]||'').toUpperCase() }).join('')
      var unread = !n.read && mode !== 'archive'
      var isSel = !!_wgNotifSel[n.id]
      var ago = _wgExactTime(n.created_at)
      var tapAct = mode === 'select' ? 'wg-ni-toggle' : (n.order_id ? 'wg-ni-open-order' : 'wg-ni-noop')

      var leftEl = mode === 'select'
        ? '<div style="width:26px;height:26px;border-radius:50%;border:2px solid var(--forest);background:' + (isSel ? 'var(--forest)' : 'transparent') + ';display:flex;align-items:center;justify-content:center;flex-shrink:0">' + (isSel ? ic('check',12,'#fff') : '') + '</div>'
        : '<div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--forest),#3aaa3a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0">' + inits + '</div>'

      var rightEl = ''
      if (mode === 'list') rightEl =
        '<div style="display:flex;flex-direction:column;gap:4px;margin-left:6px">' +
          '<button style="padding:5px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center" data-act="wg-ni-arch-one" data-nid="' + n.id + '" title="Archive">' + ic('archive',12) + '</button>' +
          '<button style="padding:5px;border-radius:6px;border:1px solid var(--clay);background:transparent;cursor:pointer;color:var(--clay);display:flex;align-items:center;justify-content:center" data-act="wg-ni-del-one" data-nid="' + n.id + '" title="Delete">' + ic('trash',12) + '</button>' +
        '</div>'
      else if (mode === 'archive') rightEl =
        '<button style="padding:5px;border-radius:6px;border:1px solid var(--clay);background:transparent;cursor:pointer;color:var(--clay);margin-left:6px;display:flex;align-items:center;justify-content:center" data-act="wg-ni-del-one" data-nid="' + n.id + '">' + ic('trash',12) + '</button>'

      // Delivery confirmation buttons shown directly in notification card
      var _isDeliveryNotif = !!(n.order_id && n.actor_id && mode === 'list' &&
        ((n.title || '').indexOf('marked your order as delivered') >= 0 ||
         (n.title || '').indexOf('Did you receive it?') >= 0 ||
         (n.title || '').indexOf('delivered. Did you') >= 0))
      var confirmRow = _isDeliveryNotif ?
        '<div style="display:flex;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">' +
          '<button style="padding:8px 18px;border-radius:6px;background:var(--forest);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;flex:2" data-act="wg-buyer-delivery-sheet" data-id="' + n.order_id + '" data-sid="' + n.actor_id + '">Confirm</button>' +
          '<button style="padding:8px 14px;border-radius:6px;background:transparent;color:var(--ink);font-size:13px;font-weight:600;border:1.5px solid var(--line);cursor:pointer;flex:1" data-act="wg-not-yet" data-id="' + n.order_id + '" data-sid="' + n.actor_id + '">Deny</button>' +
        '</div>' : ''

      return '<div id="wg-ni-' + n.id + '" style="padding:12px 6px;border-bottom:1px solid var(--border);border-radius:8px;' + (unread ? 'background:rgba(31,61,43,.07);' : '') + '">' +
        '<div data-act="' + tapAct + '" data-nid="' + n.id + '" data-oid="' + (n.order_id || '') + '" style="display:flex;align-items:center;gap:12px;cursor:pointer">' +
          leftEl +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:14px;font-weight:' + (unread ? '700' : '500') + ';color:var(--ink);line-height:1.35">' + esc(n.title || '') + '</div>' +
            (n.body ? '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(n.body) + '</div>' : '') +
            '<div style="font-size:11px;color:var(--ink-soft);margin-top:3px">' + ago + '</div>' +
          '</div>' +
          (unread ? '<div style="width:9px;height:9px;border-radius:50%;background:#DC143C;flex-shrink:0"></div>' : '') +
          rightEl +
        '</div>' +
        confirmRow +
      '</div>'
    }).join('')
  } catch(e) {
    var b = document.getElementById('wg-nlist')
    if (b) b.innerHTML = '<div style="padding:24px;text-align:center"><p class="muted" style="font-size:13px">Could not load notifications.<br>Make sure weagri-gamechanger.sql has been applied in Supabase.</p></div>'
  }
}

// ── Relative time helper ──────────────────────────────────────────────
function _wgTimeAgo(iso) {
  try {
    var d = (Date.now() - new Date(iso).getTime()) / 1000
    if (d < 60) return 'just now'
    if (d < 3600) return Math.floor(d/60) + 'm ago'
    if (d < 86400) return Math.floor(d/3600) + 'h ago'
    if (d < 604800) return Math.floor(d/86400) + 'd ago'
    return Math.floor(d/604800) + 'w ago'
  } catch(e) { return '' }
}

/* =====================================================================
   WEAGRI — TIMESTAMPS + MESSAGE TICKS  v1.0
   Real-time/date on posts, notifications, messages
   WhatsApp-style ticks: 1 gray = sent, 2 gray = delivered, 2 blue = seen
   ===================================================================== */

// ── Tick SVG strings ──────────────────────────────────────────────────
var _TICK_1  = '<span class="wg-tick" style="display:inline-flex;align-items:center;gap:0;opacity:.7"><svg width="13" height="10" viewBox="0 0 13 10" fill="none"><polyline points="1,5.5 4.5,9 12,1" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
var _TICK_2G = '<span class="wg-tick" style="display:inline-flex;align-items:center;gap:0;opacity:.8"><svg width="18" height="10" viewBox="0 0 18 10" fill="none"><polyline points="1,5.5 4.5,9 12,1" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><polyline points="6,5.5 9.5,9 17,1" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
var _TICK_2B = '<span class="wg-tick" style="display:inline-flex;align-items:center;gap:0"><svg width="18" height="10" viewBox="0 0 18 10" fill="none"><polyline points="1,5.5 4.5,9 12,1" stroke="#3B82F6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><polyline points="6,5.5 9.5,9 17,1" stroke="#3B82F6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'

// ── Exact time formatter ──────────────────────────────────────────────
function _wgExactTime(iso) {
  try {
    var d   = new Date(iso)
    var now = new Date()
    var hm  = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0')
    var isToday     = now.toDateString() === d.toDateString()
    var isYesterday = new Date(now - 86400000).toDateString() === d.toDateString()
    var dayNames    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
    var withinWeek  = (now - d) < 7 * 86400000
    if (isToday)     return hm
    if (isYesterday) return 'Yesterday ' + hm
    if (withinWeek)  return dayNames[d.getDay()] + ' ' + hm
    return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear().toString().slice(2) + ' ' + hm
  } catch(e) { return '' }
}

// ── Pick the right tick for a message ────────────────────────────────
function _wgTick(m) {
  if (m.seen)      return _TICK_2B
  if (m.delivered) return _TICK_2G
  return _TICK_1
}

    await sb.from('messages')
      .update({ seen: true, delivered: true })
      .eq('sender_id', otherId)

  // Reflect instantly on screen
  document.querySelectorAll('#msgs .wg-tick').forEach(function(el) {
    var bubble = el.closest('.bubble')
    if (bubble && bubble.getAttribute('data-mine') !== '1') {
      // incoming — no tick shown anyway
    }
  })
}

async function wgMarkDelivered(otherId) {
  try {
    await sb.from('messages')
      .update({ delivered: true })
      .eq('receiver_id', S.profile.id)
      .eq('delivered', false)
  } catch(e) {}
}
function wgStartPresencePing() {
  function _ping() {
    if (!S.profile || !S.profile.id) return
    sb.from('profiles').update({ last_seen: new Date().toISOString() })
      .eq('id', S.profile.id).then(function(){}).catch(function(){})
    // Mark all messages received by this user as delivered (✓✓ gray)
    wgMarkDelivered().catch(function(){})
  }
  _ping()
  setInterval(_ping, 60000)
}

// ── Presence ping — update last_seen every 30 s ──────────────────────
async function wgPresencePing() {
  try {
    await sb.from('profiles')
      .update({ last_seen: new Date().toISOString() })
      .eq('id', S.profile.id)
  } catch(e) {}
}

// ── Realtime: update ticks on screen when status changes ─────────────
function wgSubscribeMsgStatus(threadId) {
  if (S._tickSub) { try { S._tickSub.unsubscribe() } catch(e2) {} }
  S._tickSub = sb.channel('ticks_' + threadId)
    .on('postgres_changes', {
      event:  'UPDATE',
      schema: 'public',
      table:  'messages',
      filter: 'sender_id=eq.' + S.profile.id
    }, function(payload) {
      var m   = payload.new
      var mid = m.id
      var el  = document.querySelector('[data-mid="' + mid + '"] .wg-meta-tick')
      if (el) el.innerHTML = _wgTick(m)
    })
    .subscribe()
}

function _wgVerifPhotoStep(stepNum, title, desc, field, nextAct) {

    '<div style="padding:16px 16px 24px">' +
    _wgVP(stepNum,7) +
    '<h3 style="font-size:18px;margin-bottom:8px">' + title + '</h3>' +

      (hasPrev ? ((_wgVD[field] && _wgVD[field].type && _wgVD[field].type.indexOf('image/') === 0) ? '<img src="' + URL.createObjectURL(_wgVD[field]) + '" style="width:100%;height:100%;object-fit:cover;border-radius:12px">' : '<div style="text-align:center;color:var(--forest)">' + ic('check',36) + '<p style="font-size:13px;margin-top:8px;font-weight:700">' + t('fileSelected') + '</p></div>') :
        '<div style="text-align:center;color:var(--ink-soft)">' + ic('camera',40) + '<p style="font-size:13px;margin-top:8px">' + t('noPhotoYet') + '</p></div>') +
    '</div>' +
    '<input type="file" id="wg-cam-' + field + '" accept="image/*" capture="environment" style="display:none">' +
    '<input type="file" id="wg-upl-' + field + '" accept="image/*,.pdf" style="display:none">' +
    '<div style="display:flex;gap:10px;margin-bottom:20px">' +
      '<button class="btn btn-primary" style="flex:1" data-act="wg-idcam" data-field="' + field + '">' + ic('camera',16) + ' ' + t('takePhoto') + '</button>' +
      '<button class="btn btn-ghost" style="flex:1" onclick="document.getElementById(\'wg-upl-' + field + '\').click()">' + ic('box',16) + ' ' + t('uploadFile') + '</button>' +
    '</div>' +
    '<button id="wg-vnext-' + field + '" class="btn btn-primary" data-act="' + nextAct + '"' + (hasPrev?'':' disabled style="opacity:.45"') + '>' + t('continue') + ' \u2192</button>' +
    '</div>'
  )
  // Wire file inputs after render
  function wireInput(inputId, field2) {
    setTimeout(function() {
      var inp = document.getElementById(inputId)
      if (!inp) return
      inp.onchange = function() {
        var file = inp.files && inp.files[0]; if (!file) return
        _wgVD[field2] = file
        var prev = document.getElementById('wg-vpreview-' + field2)
        if (prev) {
          if (file.type.startsWith('image/')) {
            var url = URL.createObjectURL(file)
            prev.innerHTML = '<img src="' + url + '" style="width:100%;height:100%;object-fit:cover;border-radius:12px">'
          } else {
            prev.innerHTML = '<div style="text-align:center;color:var(--forest)">' + ic('box',32) + '<p style="font-size:12px;margin-top:8px">' + esc(file.name) + '</p></div>'
          }
        }
        var nb = document.getElementById('wg-vnext-' + field2)
        if (nb) { nb.disabled = false; nb.style.opacity = '1' }
      }
    }, 100)
  }
  wireInput('wg-cam-' + field, field)
  wireInput('wg-upl-' + field, field)
}

async function wgVerifSubmit() {
  // System completeness check — every required item must be filled before the
  // badge can go live (front ID photo, back ID photo, phone, farmer certificate).
  var ph = _wgVD.phone || (S.profile && S.profile.phone) || ''
  if (!_wgVD.front_id || !_wgVD.back_id || !_wgVD.farmer_cert || !ph.trim()) {
    toast(t('verifIncomplete')); return
  }
  openSheet('', '<div style="padding:32px;text-align:center">' + wgSpinHtml() + '<p class="muted" style="margin-top:14px;font-size:13px">' + t('uploadingDocs') + '</p></div>')
  try {
    var uid = S.profile.id
    async function up(file, name) {
      if (!file) return null
      var ext = (file.name || '').split('.').pop() || 'jpg'
      var path = uid + '/' + name + '.' + ext
      var ur = await sb.storage.from('verifications').upload(path, file, { upsert: true })
      if (ur.error) throw ur.error
      return path
    }
    var fp = await up(_wgVD.front_id, 'front_id')
    var bp = await up(_wgVD.back_id, 'back_id')
    var cp = await up(_wgVD.farmer_cert, 'farmer_cert')
    var nowIso = new Date().toISOString()
    // Everything is filled → verification goes LIVE immediately.
    await sb.from('verifications').upsert({
      seller_id: uid, country: _wgVD.country || 'Tanzania',
      phone: ph,
      has_nfc_chip: _wgVD.hasNfc === 'yes',
      front_id_url: fp, back_id_url: bp, farmer_cert_url: cp,
      status: 'approved', submitted_at: nowIso, reviewed_at: nowIso
    }, { onConflict: 'seller_id' })
    await sb.from('profiles').update({ is_verified: true, verification_status: 'approved' }).eq('id', uid)
    S.profile.is_verified = true; S.profile.verification_status = 'approved'
    closeSheet(); toast(t('verifLive')); sellerProfile()
  } catch(e) { showErr(t('verifError') + ': ' + e.message) }
}

// ── Live ID camera capture (Front / Back of ID) ────────────────────────
// Opens a full-screen camera, asks the browser for camera permission, lets the
// seller frame the ID and snap a photo. Works for both 'front_id' & 'back_id'.
var _wgCamStream = null
async function wgStartIdCamera(field, title) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast(t('cameraDenied')); return }
  var ov = document.createElement('div'); ov.className = 'wg-cam-ov'; ov.id = 'wg-cam-ov'
  ov.innerHTML =
    '<div class="wg-cam-load" id="wg-cam-load">' + wgSpinHtml() + '<div style="font-size:13px">' + esc(t('startingCamera')) + '</div></div>' +
    '<video id="wg-cam-v" autoplay playsinline muted></video>' +
    '<div class="wg-cam-frame"><div class="wg-cam-guide"></div></div>' +
    '<div class="wg-cam-bar"><button class="wg-cam-x" id="wg-cam-x" aria-label="close">\u2715</button><b>' + esc(title || '') + '</b><span style="width:40px"></span></div>' +
    '<div class="wg-cam-hint">' + esc(t('cameraTitle')) + '</div>' +
    '<div class="wg-cam-ctrl"><button class="wg-cam-shoot" id="wg-cam-shoot" aria-label="capture"></button></div>'
  document.body.appendChild(ov)
  document.getElementById('wg-cam-x').onclick = wgCloseCamera
  document.getElementById('wg-cam-shoot').onclick = function () { wgCaptureId(field) }
  try {
    _wgCamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    var v = document.getElementById('wg-cam-v'); if (!v) { wgStopCamStream(); return }
    v.srcObject = _wgCamStream
    var ld = document.getElementById('wg-cam-load'); if (ld) ld.style.display = 'none'
  } catch (e) {
    wgCloseCamera(); toast(t('cameraDenied'))
  }
}
function wgCaptureId(field) {
  var v = document.getElementById('wg-cam-v'); if (!v) return
  var w = v.videoWidth || 1280, h = v.videoHeight || 720
  var c = document.createElement('canvas'); c.width = w; c.height = h
  try { c.getContext('2d').drawImage(v, 0, 0, w, h) } catch (e) { toast(t('errOccurred')); return }
  c.toBlob(function (blob) {
    if (!blob) { toast(t('errOccurred')); return }
    _wgVD[field] = new File([blob], field + '_' + Date.now() + '.jpg', { type: 'image/jpeg' })
    wgCloseCamera()
    // Re-render the matching photo step so the captured image preview shows + Continue enables.
    if (field === 'front_id') wgVerifS4(); else if (field === 'back_id') wgVerifS5()
  }, 'image/jpeg', 0.9)
}
function wgStopCamStream() {
  if (_wgCamStream) { try { _wgCamStream.getTracks().forEach(function (tk) { tk.stop() }) } catch (e) {} _wgCamStream = null }
}
function wgCloseCamera() {
  wgStopCamStream()
  var ov = document.getElementById('wg-cam-ov'); if (ov) ov.remove()
}

function wgVerifS2Continue() {
  var c1 = document.getElementById('wg-vc1'), c2 = document.getElementById('wg-vc2')

  if (!c2 || !c2.checked) { toast(t('agreeConsentFirst')); return }

function wgDeviceId() {
  var k='wg_dev',id=localStorage.getItem(k)
  if(!id){id='D'+Math.random().toString(36).slice(2,10).toUpperCase()+Date.now().toString(36).toUpperCase();localStorage.setItem(k,id)}
  return id
}
function wgDeviceName() {
  var ua=navigator.userAgent
  if(/iPhone/.test(ua)) return 'iPhone'
  if(/iPad/.test(ua)) return 'iPad'
  if(/Android/.test(ua)) return 'Android'
  if(/Windows/.test(ua)) return 'Windows PC'
  if(/Mac/.test(ua)) return 'Mac'
  return 'Browser'
}

// ── Two-Step Verification (Supabase TOTP MFA) ──────────────────────────
async function wgSetup2FA() {
  openSheet(t('twoFaTitle'), '<div style="padding:20px;text-align:center">' + wgSpinHtml() + '</div>')
  try {
    var factors = await sb.auth.mfa.listFactors()
    var totpFactors = (factors.data && factors.data.totp) || []
    if (totpFactors.length > 0) {
      setSheetBody('<div style="padding:16px;text-align:center">' +
        '<div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--forest),#3aaa3a);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">' + ic('shield',30,'#fff') + '</div>' +
        '<h3 style="color:var(--forest);margin-bottom:8px">' + t('twoFaActive') + '</h3>' +
        '<p class="muted" style="font-size:13px;margin-bottom:20px">Your account is protected with an authenticator app. Each login requires a 6-digit code from your app.</p>' +
        '<button class="btn btn-ghost" style="color:var(--clay)" data-act="wg-dis-2fa" data-fid="' + totpFactors[0].id + '">' + t('twoFaDisable') + '</button>' +
      '</div>')
      return
    }
    var enroll = await sb.auth.mfa.enroll({ factorType: 'totp', issuer: 'WeAgri' })
    if (enroll.error) throw enroll.error
    var factor = enroll.data
    setSheetBody('<div style="padding:16px">' +
      '<h3 style="font-size:18px;margin-bottom:8px">' + t('twoFaTitle') + '</h3>' +
      '<p class="muted" style="font-size:13px;margin-bottom:16px">' + t('twoFaScanQR') + ' (Google Authenticator / Authy).</p>' +
      '<div style="text-align:center;margin-bottom:16px"><img src="' + factor.totp.qr_code + '" width="180" height="180" style="border-radius:12px;border:1px solid var(--border)"></div>' +
      '<details style="margin-bottom:16px"><summary style="font-size:12px;color:var(--ink-soft);cursor:pointer">Show manual key</summary>' +
      '<p style="font-size:11px;word-break:break-all;margin-top:8px;padding:10px;background:var(--leaf-soft);border-radius:8px;font-family:monospace">' + esc(factor.totp.secret) + '</p></details>' +
      '<label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px">' + t('twoFaEnterCode') + '</label>' +
      '<input id="wg-2fa-code" type="number" inputmode="numeric" maxlength="6" class="input" placeholder="000000" style="letter-spacing:8px;font-size:22px;text-align:center;margin-bottom:6px">' +
      '<div id="wg-2fa-err" style="color:var(--clay);font-size:12px;min-height:16px;margin-bottom:14px"></div>' +
      '<button class="btn btn-primary" data-act="wg-do-2fa" data-fid="' + factor.id + '">' + ic('shield',16) + ' ' + t('twoFaActivate') + '</button>' +
    '</div>')
  } catch(e){ showErr(e.message) }
}

async function wgDo2FA(factorId) {
  var code=(document.getElementById('wg-2fa-code')||{}).value||''
  var errEl=document.getElementById('wg-2fa-err')
  if(code.length<6){if(errEl)errEl.textContent='Enter the 6-digit code';return}
  var btn=document.querySelector('[data-act="wg-do-2fa"]')
  if(btn){btn.disabled=true;btn.textContent='Verifying...'}
  try {
    var ch=await sb.auth.mfa.createChallenge({factorId:factorId})
    if(ch.error) throw ch.error
    var vf=await sb.auth.mfa.verify({factorId:factorId,challengeId:ch.data.id,code:code.trim()})
    if(vf.error) throw vf.error
    closeSheet(); toast(t('twoFaSuccess'))
  } catch(e){
    if(errEl) errEl.textContent='Incorrect code. Try again.'
    if(btn){btn.disabled=false;btn.innerHTML=ic('shield',16)+' '+t('twoFaActivate')}
  }
}

async function wgDis2FA(factorId) {
  try {
    await sb.auth.mfa.unenroll({factorId:factorId})
    closeSheet(); toast(t('twoFaRemoved'))
  } catch(e){ showErr(e.message) }
}
