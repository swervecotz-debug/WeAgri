<title>WeAgri — Agricultural Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#16243f; --navy-2:#1e3358;
  --forest:#1f3d2b; --forest-2:#2d5239; --leaf:#3f7d4f; --leaf-soft:#e3efe4;
  --maize:#e8b04b; --maize-soft:#f7e7c4; --clay:#c85a3a; --clay-soft:#f6ddd2;
  --bone:#f4efe2; --bone-2:#ece4d2; --card:#fffdf8; --ink:#20211c; --ink-soft:#5b5a4f;
  --line:#e2dbc8; --shadow:0 10px 30px -12px rgba(31,61,43,.28); --shadow-sm:0 4px 14px -8px rgba(31,61,43,.3);
  --radius:22px; --radius-sm:14px;
  --display:'Bricolage Grotesque',sans-serif; --body:'Plus Jakarta Sans',sans-serif;
  --boost:linear-gradient(95deg,#0a84ff 0%,#7b2ff7 55%,#e1306c 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{min-height:100%}
body{font-family:var(--body);background:var(--bone);color:var(--ink);-webkit-font-smoothing:antialiased}
#root{
  max-width:1080px;margin:0 auto;position:relative;min-height:100vh;
  background:
    radial-gradient(120% 50% at 0% 0%,rgba(232,176,75,.10),transparent 60%),
    radial-gradient(120% 50% at 100% 100%,rgba(63,125,79,.10),transparent 60%),var(--bone);
  box-shadow:0 0 60px -20px rgba(0,0,0,.15);
}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.05;letter-spacing:-.02em}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--body);font-size:16px}
a{color:var(--leaf)}
.muted{color:var(--ink-soft)} .center{text-align:center}
.app-shell{min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.page-pad{padding:22px}
@media(min-width:720px){.page-pad{padding:30px 36px}}
.wrap-narrow{max-width:560px;margin-inline:auto}

/* fade-in for screens */
.fade-in{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pop{animation:pop .25s cubic-bezier(.22,1,.36,1) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:15px 20px;border-radius:var(--radius-sm);font-weight:700;font-size:16px;
  transition:transform .15s,box-shadow .2s,opacity .2s,filter .2s}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--forest);color:#fff;box-shadow:var(--shadow-sm)}
.btn-maize{background:var(--maize);color:var(--forest);box-shadow:var(--shadow-sm)}
.btn-clay{background:var(--clay);color:#fff}
.btn-ghost{background:var(--card);color:var(--forest);border:1.5px solid var(--line)}
.btn-boost{background:var(--boost);color:#fff;box-shadow:0 8px 22px -8px rgba(123,47,247,.6)}

/* compact boost button on cards */
.boost-btn{margin-top:auto;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 10px;border-radius:10px;font-weight:700;font-size:12px;color:#fff;background:var(--boost);
  box-shadow:0 6px 16px -8px rgba(123,47,247,.6);transition:transform .15s,filter .2s}
.boost-btn:active{transform:scale(.96)} .boost-btn:hover{filter:brightness(1.05)}

/* inputs */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px}
.input,.select,.textarea{width:100%;padding:14px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(63,125,79,.12)}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--leaf-soft);color:var(--forest);border:1px solid transparent;white-space:nowrap;cursor:pointer}
.chip.selected{background:var(--forest);color:#fff}
.row-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}

/* grids */
.auto-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.auto-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:880px){.auto-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* search bar */
.search-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--line)}
.search-bar input{border:none;outline:none;background:none;width:100%;color:var(--ink)}

/* sponsored / near badges */
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:3px}
.badge-sponsored{background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(4px);text-transform:uppercase;letter-spacing:.03em}
.badge-near{background:var(--maize);color:var(--forest)}
.views-pill{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;backdrop-filter:blur(2px)}

/* product card photo box */
.photo{display:flex;align-items:center;justify-content:center;background:var(--bone-2);position:relative;background-size:cover;background-position:center}

/* stat cards */
.stat{padding:16px;border:none;border-radius:var(--radius)}
.stat .v{font-size:22px;font-weight:800;font-family:var(--display)}
.stat .l{font-size:12px;opacity:.82;margin-top:2px}

/* ticker */
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker{overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:10px 0}
.ticker-track{display:inline-flex;white-space:nowrap;animation:ticker 30s linear infinite}
.ticker-item{padding:0 18px;font-size:13px;font-weight:600}

/* bottom nav */
.bottom-nav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;align-items:center;
  background:rgba(255,253,248,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.bottom-nav-inner{display:flex;justify-content:space-around;width:100%;max-width:640px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);font-size:11px;font-weight:600;flex:1;padding:4px;background:none}
.nav-item.active{color:var(--forest)}
.nav-ic{width:44px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s}
.nav-item.active .nav-ic{background:var(--maize)}

/* fab */
.fab{position:fixed;bottom:80px;right:18px;width:58px;height:58px;border-radius:20px;background:var(--clay);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 12px 28px -8px rgba(200,90,58,.6);z-index:45}
@media(min-width:1120px){.fab{right:calc(50% - 522px)}}

/* modal / bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(20,25,18,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:slideup .3s cubic-bezier(.22,1,.36,1) both}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h3{font-size:19px}
.x{font-size:22px;color:var(--ink-soft);line-height:1;background:none}

/* select-card (role / payment) */
.opt{padding:14px;text-align:left;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--card);
  display:flex;gap:12px;align-items:center;width:100%;cursor:pointer;transition:.15s}
.opt.sel{border-color:var(--leaf);background:var(--leaf-soft)}
.opt .em{width:42px;height:42px;border-radius:12px;background:var(--bone-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.opt.sel .em{background:var(--forest);color:#fff}

/* avatar */
.av{border-radius:14px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;flex-shrink:0}

/* progress dots (delivery) */
.track{display:flex;align-items:center}
.track .dot{width:14px;height:14px;border-radius:50%;background:var(--line);flex-shrink:0}
.track .dot.on{background:var(--leaf)}
.track .bar{flex:1;height:3px;background:var(--line)}

/* ---------- Small helpers (pure functions) ---------- */
window.H = {
  currencyFor(code) { return (window.COUNTRIES.find(c => c.code === code) || {}).currency || 'TZS' },
  money(amount, country) {
    const cur = window.H.currencyFor(country)
    return cur + ' ' + Number(amount || 0).toLocaleString()
  },
  qrPrefix: 'weagri://seller/',
  makeQrPayload(id) { return window.H.qrPrefix + id },
  parseQrPayload(text) {
    if (typeof text !== 'string') return null
    if (text.startsWith(window.H.qrPrefix)) return text.slice(window.H.qrPrefix.length)
    if (text.startsWith('shambalink://farm/')) return text.slice('shambalink://farm/'.length)
    return null
  },
  boostPriceFor(country) {
    const cur = window.H.currencyFor(country)
    if (cur === 'TZS') return { amount: window.CFG.BOOST.TZS, currency: 'TZS', label: 'TZS ' + window.CFG.BOOST.TZS.toLocaleString() }
    return { amount: window.CFG.BOOST.USD, currency: 'USD', label: '$' + window.CFG.BOOST.USD }
  },
  // compare a seller price to latest market price -> {status:'high'|'low'|'fair'|null, ref, pct, unit}
  marketCompare(price, row) {
    const p = Number(price)
    if (!row || !p || p <= 0) return { status: null }
    const ref = Number(row.price); if (!ref) return { status: null }
    const pct = Math.round(((p - ref) / ref) * 100)
    let status = 'fair'; if (pct > 15) status = 'high'; else if (pct < -15) status = 'low'
    return { status, ref, pct, unit: row.unit, name: row.product_name }
  },
  findMarketRow(rows, title, category) {
    if (!rows || !rows.length) return null
    const tt = (title || '').trim().toLowerCase()
    if (tt) {
      const exact = rows.find(r => r.product_name.toLowerCase() === tt); if (exact) return exact
      const part = rows.find(r => tt.includes(r.product_name.toLowerCase()) || r.product_name.toLowerCase().includes(tt)); if (part) return part
    }
    const fb = { grains: 'Maize', vegetables: 'Tomatoes', fruits: 'Mangoes', meat: 'Beef', milk: 'Milk', eggs: 'Eggs', poultry: 'Eggs' }[category]
    if (fb) return rows.find(r => r.product_name.toLowerCase() === fb.toLowerCase()) || null
    return null
  },
  isBoosted(p) { return p && p.boosted_until && new Date(p.boosted_until) > new Date() },
  sellerTypeLabel(type) {
    return ({ farmer: 'farmer', livestock: 'livestock', seed: 'seedSeller', fertilizer: 'fertilizerSeller', doctor_plants: 'plantDoctor', doctor_animals: 'animalDoctor' })[type] || 'seller'
  },
  cat(key) { return window.CATEGORIES.find(c => c.key === key) || null },
}

window.TERMS = [{"t": "Overview", "h": "<h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">WeAgri Terms of Service &amp; Privacy Policy</h4><p style=\"line-height:1.7;margin-bottom:10px\">These Terms of Service and Privacy Policy govern the use of the WeAgri mobile application and website platform. By accessing or using WeAgri, users agree to comply with these terms.</p>"}, {"t": "TERMS OF SERVICE", "h": "<h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">1. About WeAgri</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri is a digital agricultural ecosystem designed to connect farmers, livestock farmers, buyers, agricultural experts, seed sellers, fertilizer suppliers, and other agricultural stakeholders through marketplace, communication, educational, and verification services.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">2. User Eligibility</h4><p style=\"line-height:1.7;margin-bottom:10px\">Users must provide accurate information during registration. Users are responsible for maintaining the confidentiality of their accounts and passwords.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">3. User Roles</h4><p style=\"line-height:1.7;margin-bottom:10px\">Users may register as farmers, livestock farmers, buyers, agricultural experts, seed sellers, fertilizer suppliers, or other approved categories. A user may operate multiple roles through within our services where permitted by Swerve.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">4. Verification</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri may request identity documents, farm information, GPS location, livestock information, business permits, selfies, or other verification data to improve trust and security. Submission of verification documents does not guarantee approval.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">5. Marketplace Rules</h4><p style=\"line-height:1.7;margin-bottom:10px\">Users must not upload fake products, misleading information, stolen images, prohibited items, or fraudulent listings. Sellers are responsible for the accuracy and quality of their products.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">6. Payments</h4><p style=\"line-height:1.7;margin-bottom:10px\">Payments conducted through WeAgri may be processed via mobile money, or any integrated payment systems. WeAgri may charge transaction or service fees where applicable.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">7. Ratings and Reviews</h4><p style=\"line-height:1.7;margin-bottom:10px\">Buyers may rate sellers and experts based on completed transactions or consultations. Fake reviews, manipulation, or abuse of the rating system is prohibited.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">8. Messaging and Calls</h4><p style=\"line-height:1.7;margin-bottom:10px\">Users may communicate through messaging, voice notes, or calling features. Harassment, fraud, hate speech, abuse, or illegal communication is prohibited.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">9. Agricultural Experts</h4><p style=\"line-height:1.7;margin-bottom:10px\">Agricultural experts and livestock doctors using WeAgri must provide truthful and professional information. WeAgri does not guarantee medical, veterinary, or agricultural outcomes from advice provided on the platform.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">10. Intellectual Property</h4><p style=\"line-height:1.7;margin-bottom:10px\">The WeAgri name, logo, system design, software, and content are protected intellectual property. Users may not copy, reverse engineer, or exploit WeAgri services without permission.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">11. Prohibited Activities</h4><p style=\"line-height:1.7;margin-bottom:10px\">Users may not engage in fraud, fake verification, identity theft, spam, illegal trading, malware distribution, exploitation of platform vulnerabilities, or unauthorized data extraction.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">12. Account Suspension</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri reserves the right to suspend or terminate accounts involved in suspicious activities, scams, policy violations, fake products, or abuse of the platform.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">13. Limitation of Liability</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri acts as a digital platform connecting users and does not guarantee product quality, delivery success, disease treatment outcomes, or uninterrupted platform availability.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">14. Changes to Terms</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri may update these Terms periodically. Continued use of the platform after updates constitutes acceptance of revised terms.</p>"}, {"t": "PRIVACY POLICY", "h": "<h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">1. Information We Collect</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri may collect personal information including names, phone numbers, email addresses, GPS locations, identity documents, business information, farm information, livestock information, uploaded images, transaction records, and communication data.</p><p style=\"line-height:1.7;margin-bottom:10px\">On WeAgri , you can send messages, take photos, buy or sell things and much more. We call all of the things you can do on our Products \"activity.\" We collect your activity across our WeAgri and Information you provide,such as;</p><p style=\"line-height:1.7;margin-bottom:10px\">Contents you create, like posts,or audio.</p><p style=\"line-height:1.7;margin-bottom:10px\">Content you provide through our camera feature or your camera roll settings, or through our voice-enabled features.</p><p style=\"line-height:1.7;margin-bottom:10px\">Messages you send and receive, including their content, subject to applicable law.</p><p style=\"line-height:1.7;margin-bottom:10px\">Types of content, including ads, you view or interact with, and how you interact with it.</p><p style=\"line-height:1.7;margin-bottom:10px\">Features you use, and what actions you take in them.</p><p style=\"line-height:1.7;margin-bottom:10px\">Purchases or other transactions you make, such as through Swerve checkout experiences, including mobile payments information.</p><p style=\"line-height:1.7;margin-bottom:10px\">The time, frequency and duration of your activities on our Product.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">2. How We Use Information</h4><p style=\"line-height:1.7;margin-bottom:10px\">Collected information may be used to verify users, improve platform security, facilitate transactions, provide customer support, improve services, develop AI systems, detect fraud, and generate analytics.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">3. AI and Data Usage</h4><p style=\"line-height:1.7;margin-bottom:10px\">Anonymized or aggregated data generated through platform interactions may be used to improve future artificial intelligence systems, agricultural recommendations, disease detection systems, and analytics services.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">4. Data Protection</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri takes reasonable security measures to protect user information. However, no online platform can guarantee absolute security.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">5. Data Sharing</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri does not sell personal data to third parties. Information may be shared with payment providers, logistics partners, legal authorities, or verification partners where necessary.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">6. User Rights</h4><p style=\"line-height:1.7;margin-bottom:10px\">Users may request access, correction, or deletion of personal information where legally permitted.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">7. Cookies and Tracking</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri may use cookies, analytics tools, and tracking technologies to improve platform performance and user experience.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">8. Children</h4><p style=\"line-height:1.7;margin-bottom:10px\">Users under the legally required age(18 years and below) must use WeAgri under supervision or with appropriate legal consent where applicable.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">9. Third-Party Services</h4><p style=\"line-height:1.7;margin-bottom:10px\">WeAgri may integrate with third-party services such as payment providers, maps, analytics systems, cloud services, or communication providers.</p><h4 style=\"font-size:16px;color:var(--forest);margin:16px 0 6px\">10. Contact</h4><p style=\"line-height:1.7;margin-bottom:10px\">For legal, privacy, or policy questions, users may contact WeAgri support through our email account swerve.co.tz@gmail.com or Phone Number +255627806824.</p>"}, {"t": "How do the Swerve Companies work together?", "h": "<p style=\"line-height:1.7;margin-bottom:10px\">We are part of the Swerve Companies that provide Swerve Company Products.</p><p style=\"line-height:1.7;margin-bottom:10px\">Swerve Company Products include all Swerve products covered by this Policy plus other products like MyEdu and Many more to come.</p><p style=\"line-height:1.7;margin-bottom:10px\">We share information we collect, infrastructure, systems and technology with the other Swerve Companies.</p><p style=\"line-height:1.7;margin-bottom:10px\">We also process information that we receive about you from other Swerve Companies, according to their terms and policies and as permitted by applicable law. In some cases, Swerve acts as a Service provider for other Swerve Companies. We act on their behalf and in accordance with their instructions and terms.</p><p style=\"line-height:1.7;margin-bottom:10px\">Why we share across the Swerve Companies</p><p style=\"line-height:1.7;margin-bottom:10px\">Swerve Products share information with other Swerve Companies:</p><p style=\"line-height:1.7;margin-bottom:10px\">To promote safety, security and integrity and comply with applicable laws</p><p style=\"line-height:1.7;margin-bottom:10px\">To personalize offers, ads and other sponsored or commercial content</p><p style=\"line-height:1.7;margin-bottom:10px\">To develop, provide and personalize features and integrations</p><p style=\"line-height:1.7;margin-bottom:10px\">To understand how people use and interact with Swerve Company Products</p>"}, {"t": "FUTURE FEATURES & DISCLAIMERS", "h": "<p style=\"line-height:1.7;margin-bottom:10px\">WeAgri may introduce future features including AI tools, disease prediction systems, digital identity systems, traceability services, logistics systems, financial tools, subscriptions, advertisements, and premium services. Use of future features may be governed by additional policies and agreements.</p><p style=\"line-height:1.7;margin-bottom:10px\">By using WeAgri, users acknowledge that they have read, understood, and agreed to these Terms of Service and Privacy Policy.</p>"}];

<script>
/* ============================================================
   WeAgri — APP  (plain JavaScript, no build step)
   ------------------------------------------------------------
   TABLE OF CONTENTS  (search these tags to jump around)
     [UTIL]      tiny helpers (escape, t, money, toast, errors)
     [STATE]     app state + Supabase client
     [BOOT]      startup + auth listener + router
     [SHEET]     modal / bottom-sheet helper
     [WIDGETS]   product cards, ticker, bottom nav, chart
     [ONBOARD]   language + country screens
     [AUTH]      login + multi-step signup
     [SELLER]    seller dashboard (home/market/orders/wallet/profile)
     [BUYER]     buyer dashboard (discover/scan/deliveries/chat/profile)
   ============================================================ */
(function () {
'use strict'

/* ---------------- [UTIL] ---------------- */
var root = document.getElementById('root')
function $(sel, r) { return (r || document).querySelector(sel) }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c] }) }
function t(k) { var d = window.DICT[S.lang] || window.DICT.en; return d[k] != null ? d[k] : (window.DICT.en[k] != null ? window.DICT.en[k] : k) }
function money(a) { return window.H.money(a, S.country) }
function firstLetter(name) { return ((name || '').trim().charAt(0) || 'U').toUpperCase() }

function toast(msg) {
  var wrap = document.getElementById('toast')
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = msg
  wrap.appendChild(el); setTimeout(function () { el.remove() }, 2600)
}
function showErr(msg) {
  var bar = document.getElementById('errbar');
  if (String(msg).indexOf('Failed to fetch') >= 0 || String(msg).indexOf('NetworkError') >= 0) {
    bar.style.background = '#3a2d12';
    bar.innerHTML = 'Could not reach the database. If you are viewing this inside the Claude chat preview, that is expected — the preview has no internet. Open the file from your web host (or a local server) and it will connect normally.';
    bar.classList.add('show'); return;
  }
  bar.textContent = msg + '  (tap to dismiss)'; bar.classList.add('show')
}
window.addEventListener('error', function (e) { showErr(e.message + '  @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno) })
window.addEventListener('unhandledrejection', function (e) { showErr('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)) })
document.getElementById('errbar').addEventListener('click', function () { this.classList.remove('show') })

/* ---------------- [STATE] ---------------- */
// storage that uses real localStorage when available (so logins persist),
// and falls back to memory if the browser blocks it (e.g. inside a sandbox)
var SAFE = (function () {
  try { var k = '__weagri_t'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return window.localStorage }
  catch (e) { var m = {}; return { getItem: function (k) { return m[k] == null ? null : m[k] }, setItem: function (k, v) { m[k] = String(v) }, removeItem: function (k) { delete m[k] } } }
})()
var sb = null
var S = {
  lang: 'sw', country: 'TZ',
  session: null, profile: null,
  view: 'lang', tab: 'home',
  signupRole: 'seller', // used while routing a freshly-created account
  _busy: false,
}
window.WeAgri = { S: S, render: render } // exposed for debugging in console

/* ---------------- [BOOT] ---------------- */
async function boot() {
  applyTheme()
  S.lang = SAFE.getItem('w_lang') || 'sw'
  S.country = SAFE.getItem('w_country') || 'TZ'
  if (!window.supabase) { showErr('Supabase library failed to load (check your internet / CDN).'); return }
  sb = window.supabase.createClient(window.CFG.SUPABASE_URL, window.CFG.SUPABASE_ANON_KEY, { auth: { storage: SAFE, persistSession: true, autoRefreshToken: true } })
  sb.auth.onAuthStateChange(function (_e, session) { if (S._busy) return; S.session = session; afterAuth() })
  try {
    var res = await sb.auth.getSession()
    S.session = res.data.session
  } catch (e) { showErr(e.message) }
  await afterAuth(true)
}

async function afterAuth() {
  if (S.session) {
    try {
      var r = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle()
      S.profile = r.data
    } catch (e) { showErr(e.message) }
    if (S.profile) {
      var _fromAuth = S.view === 'auth'
      S.view = 'dash'
      if (S.profile.role === 'admin') {
        // admin portal: its own dashboard, no marketplace tabs/presence/splash noise
        S.tab = 'ov'; render(); return
      }
      recordAccount()
      S.tab = (S.profile.role === 'buyer' || S.profile.role === 'doctor') ? 'discover' : 'home'
      /* presence pings */
try { wgPresencePing(); setInterval(wgPresencePing, 30000) } catch(_pp) {}
function _gcBoot() { try { wgCheckUrlScan() } catch(e){} try { wgStartNotifPoll() } catch(e){} try { wgCheckDevice() } catch(e){} try { wgStartPresencePing() } catch(e){} }
      if (_fromAuth) { wgShowSplash(function() { render(); _gcBoot() }) } else { render(); _gcBoot() }
      return
    }
  } else { S.profile = null }
  if (S.view === 'dash' || !S.view) {
    S.view = (SAFE.getItem('w_lang') && SAFE.getItem('w_country')) ? 'auth' : 'lang'
  }
  render()
}

function render() {
  closeSheet()
  if (S.view === 'lang') return screenLang()
  if (S.view === 'country') return screenCountry()
  if (S.view === 'auth') return screenAuth()
  if (S.view === 'dash') {
    if (S.profile && S.profile.role === 'admin') return adminDash()
    return (S.profile && (S.profile.role === 'buyer' || S.profile.role === 'doctor')) ? buyerDash() : sellerDash()
  }
}

async function logout() { S._busy = true; await sb.auth.signOut(); S._busy = false; S.session = null; S.profile = null; S.view = 'auth'; render() }

/* ---------------- [ADMIN] ----------------
   Admin logs in from the normal login screen (username "kelvin Jeremiah" typed
   into the phone field + the admin password — see authEmail()). Every number on
   these screens comes from Supabase via the admin_* RPC functions in
   supabase-admin-setup.sql, which check the caller is role='admin' before
   returning anything, so the data is real and the RPCs are useless to anyone else. */
var ADM = { gran: 'day' }

function adminNavItems() {
  return [
    { key: 'ov', ic: 'home', label: 'Overview' },
    { key: 'sales', ic: 'cash', label: 'Sales' },
    { key: 'trend', ic: 'leaf', label: 'Trending' },
    { key: 'users', ic: 'group', label: 'Users' },
  ]
}
function adminDash() {
  var nav = bottomNav(adminNavItems())
  root.innerHTML = '<div class="app-shell"><div style="flex:1;padding-bottom:84px" id="tabview"></div>' + nav + '</div>'
  if (S.tab === 'sales') adminSales()
  else if (S.tab === 'trend') adminTrending()
  else if (S.tab === 'users') adminUsers()
  else adminOverview()
}
function adminHeader(title, sub) {
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">' +
    '<div><p class="muted" style="font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--leaf)">Admin portal</p>' +
    '<h2 style="font-size:22px;color:var(--forest)">' + esc(title) + '</h2>' +
    (sub ? '<p class="muted" style="font-size:12px;margin-top:2px">' + esc(sub) + '</p>' : '') + '</div>' +
    '<button class="btn btn-ghost" style="width:auto;padding:8px 12px;font-size:13px;color:var(--clay)" data-act="logout">' + ic('exit', 15) + ' Log out</button></div>'
}
// compact number formatting for stat tiles: 1,284 / 12.9K / 4.2M
function numFmt(n) {
  n = Number(n || 0)
  if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M'
  if (Math.abs(n) >= 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K'
  return Math.round(n).toLocaleString()
}
function adminErrBox(msg) {
  return '<div class="card" style="padding:16px;border-color:var(--clay)"><b style="color:var(--clay)">Could not load this data.</b>' +
    '<p class="muted" style="font-size:13px;margin-top:6px">' + esc(msg) + '</p>' +
    '<p class="muted" style="font-size:12px;margin-top:8px">If this says the function does not exist, run supabase-admin-setup.sql in your Supabase SQL editor.</p></div>'
}
// single-hue horizontal bar list — every row is direct-labelled, so color never
// carries identity on its own (keeps this readable for colour-blind viewers too)
function adminBarList(rows, valueFmt) {
  rows = (rows || []).filter(function (r) { return r })
  if (!rows.length) return empty('archive', 'No data yet')
  var max = Math.max.apply(null, rows.map(function (r) { return Number(r.value || 0) })) || 1
  return rows.map(function (r) {
    var pct = Math.max(2, Math.round((Number(r.value || 0) / max) * 100))
    var vfmt = valueFmt ? valueFmt(r.value) : numFmt(r.value)
    return '<div style="margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="font-weight:600">' + esc(r.label) + '</span><span class="muted" style="font-variant-numeric:tabular-nums">' + esc(vfmt) + (r.sub ? ' · ' + esc(r.sub) : '') + '</span></div>' +
      '<div style="height:8px;border-radius:4px;background:var(--bone-2);overflow:hidden"><div style="height:100%;width:' + pct + '%;border-radius:4px;background:var(--leaf)"></div></div></div>'
  }).join('')
}
// fixed, reserved status colors (never reused for anything else) — always paired
// with a text label + count, so colour is never the only signal
var ADMIN_STATUS_TONE = { completed: '#3f7d4f', accepted: '#e8b04b', pending: '#c9973a', cancelled: '#c85a3a' }
function adminStatusRows(rows) {
  rows = (rows || []).filter(function (r) { return r })
  var total = rows.reduce(function (s, r) { return s + Number(r.value || 0) }, 0) || 1
  return '<div style="display:flex;flex-direction:column;gap:10px">' + rows.map(function (r) {
    var pct = Math.round((Number(r.value || 0) / total) * 100)
    var tone = ADMIN_STATUS_TONE[r.key] || 'var(--ink-soft)'
    return '<div style="display:flex;align-items:center;gap:10px">' +
      '<span style="width:10px;height:10px;border-radius:3px;background:' + tone + ';flex-shrink:0"></span>' +
      '<span style="flex:1;font-size:13px;font-weight:600">' + esc(r.label) + '</span>' +
      '<span class="muted" style="font-size:12px">' + pct + '%</span>' +
      '<b style="font-variant-numeric:tabular-nums;min-width:34px;text-align:right">' + numFmt(r.value) + '</b></div>'
  }).join('') + '</div>'
}
// bar chart for a time series: single leaf-hue bars, rounded data-ends, gridlines,
// value labelled on the last bar, first/mid/last x-axis labels, plus a plain-text
// list underneath so every value stays readable without hovering (table view).
function adminBarChart(rows, opts) {
  opts = opts || {}
  rows = rows || []
  if (!rows.length) return empty('archive', 'No data in this period yet')
  var W = 700, H = 220, padL = 46, padR = 10, padT = 14, padB = 28
  var iw = W - padL - padR, ih = H - padT - padB
  var vals = rows.map(function (r) { return Number(r.value || 0) })
  var max = Math.max.apply(null, vals.concat([1]))
  var n = rows.length, gap = 4
  var bw = Math.min(24, (iw / n) - gap)
  var grid = ''
  for (var g = 0; g <= 3; g++) {
    var val = (max * g) / 3, y = padT + ih - (val / max) * ih
    grid += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>'
    grid += '<text x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--ink-soft)">' + numFmt(val) + '</text>'
  }
  var bars = '', xlabels = ''
  rows.forEach(function (r, i) {
    var x = padL + (iw / n) * i + ((iw / n) - bw) / 2
    var bh = max ? (Number(r.value || 0) / max) * ih : 0
    var y = padT + ih - bh
    var isLast = i === rows.length - 1
    bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(bh, 1).toFixed(1) + '" rx="4" fill="var(--leaf)"><title>' + esc(r.label) + ': ' + esc(opts.valueFmt ? opts.valueFmt(r.value) : numFmt(r.value)) + '</title></rect>'
    if (isLast) bars += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--forest)">' + esc(opts.valueFmt ? opts.valueFmt(r.value) : numFmt(r.value)) + '</text>'
    if (i === 0 || isLast || i === Math.floor((n - 1) / 2)) xlabels += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="10" fill="var(--ink-soft)">' + esc(r.label) + '</text>'
  })
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet">' + grid + bars + xlabels + '</svg>'
  var list = '<div class="row-scroll" style="margin-top:10px;flex-wrap:wrap">' + rows.slice(-6).map(function (r) {
    return '<span class="chip" style="background:var(--bone-2)">' + esc(r.label) + ' <b style="margin-left:4px">' + esc(opts.valueFmt ? opts.valueFmt(r.value) : numFmt(r.value)) + '</b></span>'
  }).join('') + '</div>'
  return svg + list
}
function adminGranTabs(current) {
  return ['day', 'month', 'year'].map(function (g) {
    return '<button class="chip ' + (current === g ? 'selected' : '') + '" data-act="admin-gran" data-v="' + g + '">' + (g === 'day' ? 'Daily' : g === 'month' ? 'Monthly' : 'Yearly') + '</button>'
  }).join('')
}

// short, readable label for a date_trunc('day'|'month'|'year', …) timestamp
function fmtPeriodLabel(iso, gran) {
  try {
    var d = new Date(iso)
    if (gran === 'year') return String(d.getFullYear())
    if (gran === 'month') return d.toLocaleDateString(undefined, { month: 'short', year: '2-digit' })
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
  } catch (e) { return String(iso) }
}

function openAdCenter() {
  if (!window.AD_CENTER_HTML) { return }

  var ov = document.createElement('div'); ov.id = 'adcenter-ov'
  ov.style.cssText = 'position:fixed;inset:0;z-index:500;background:#16243f'

  document.body.appendChild(ov)
  document.getElementById('adcenter-frame').srcdoc = window.AD_CENTER_HTML
  document.getElementById('adcenter-close').onclick = function () { ov.remove() }
}

/* ---------------- [SHEET] ---------------- */
function openSheet(title, innerHTML, onMount) {
  closeSheet()
  var ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'sheet'
  ov.innerHTML = '<div class="sheet"><div class="sheet-head"><h3>' + esc(title) + '</h3><button class="x" data-close>' + ic('x', 18) + '</button></div><div id="sheet-body">' + innerHTML + '</div></div>'
  document.body.appendChild(ov)
  ov.addEventListener('click', function (e) { if (e.target === ov || (e.target.closest && e.target.closest('[data-close]'))) closeSheet() })
  if (onMount) onMount($('#sheet-body', ov))
}
function setSheetBody(html, onMount) { var b = $('#sheet-body'); if (b) { b.innerHTML = html; if (onMount) onMount(b) } }
function closeSheet() {
  if (S._scanner) { try { S._scanner.stop().then(function () { S._scanner = null }) } catch (e) { S._scanner = null } }
  var s = document.getElementById('sheet'); if (s) s.remove()
}

async function wgUploadAvatar(file) {
  if (!file || !/^image\//.test(file.type || '')) { toast(t('errOccurred')); return }
  openSheet('', '<div style="padding:32px;text-align:center">' + wgSpinHtml() + '<p class="muted" style="margin-top:14px;font-size:13px">' + t('uploadingPhoto') + '</p></div>')
  try {
    var ext = (file.name || 'jpg').split('.').pop() || 'jpg'
    var path = S.profile.id + '/avatar-' + Date.now() + '.' + ext
    var up = await sb.storage.from('avatars').upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' })
    if (up.error) throw up.error
    var url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl
    var r = await sb.from('profiles').update({ avatar_url: url }).eq('id', S.profile.id)
    if (r.error) throw r.error
    S.profile.avatar_url = url
    closeSheet(); toast(t('saved')); render()
  } catch (e) { showErr(e.message) }
}
async function wgRemoveAvatar() {
  try {
    await sb.from('profiles').update({ avatar_url: null }).eq('id', S.profile.id)
    S.profile.avatar_url = null; closeSheet(); toast(t('saved')); render()

async function wgStartAvatarCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast(t('cameraDenied')); return }
  closeSheet()
  var ov = document.createElement('div'); ov.className = 'wg-cam-ov'; ov.id = 'wg-cam-ov'
  ov.innerHTML =
    '<div class="wg-cam-load" id="wg-cam-load">' + wgSpinHtml() + '<div style="font-size:13px">' + esc(t('startingCamera')) + '</div></div>' +
    '<video id="wg-cam-v" autoplay playsinline muted></video>' +
    '<div class="wg-cam-frame"><div class="wg-cam-guide" style="border-radius:50%;width:74vw;max-width:300px;height:74vw;max-height:300px;padding-bottom:0"></div></div>' +
    '<div class="wg-cam-bar"><button class="wg-cam-x" id="wg-cam-x" aria-label="close">\u2715</button><b>' + esc(t('profilePhoto')) + '</b><span style="width:40px"></span></div>' +
    '<div class="wg-cam-hint">' + esc(t('cameraTitle')) + '</div>' +
    '<div class="wg-cam-ctrl"><button class="wg-cam-shoot" id="wg-cam-shoot" aria-label="capture"></button></div>'
  document.body.appendChild(ov)
  document.getElementById('wg-cam-x').onclick = wgCloseCamera
  document.getElementById('wg-cam-shoot').onclick = wgCaptureAvatar
  try {
    _wgCamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } }, audio: false })
    var vv = document.getElementById('wg-cam-v'); if (!vv) { wgStopCamStream(); return }
    vv.srcObject = _wgCamStream
    var ld = document.getElementById('wg-cam-load'); if (ld) ld.style.display = 'none'
  } catch (e) { wgCloseCamera(); toast(t('cameraDenied')) }
}
function wgCaptureAvatar() {
  var vv = document.getElementById('wg-cam-v'); if (!vv) return
  var w = vv.videoWidth || 720, h = vv.videoHeight || 720
  var sq = Math.min(w, h)
  var c = document.createElement('canvas'); c.width = sq; c.height = sq
  try { c.getContext('2d').drawImage(vv, (w - sq) / 2, (h - sq) / 2, sq, sq, 0, 0, sq, sq) } catch (e) { toast(t('errOccurred')); return }
  c.toBlob(function (blob) {
    if (!blob) { toast(t('errOccurred')); return }
    wgCloseCamera()
    wgUploadAvatar(new File([blob], 'avatar-' + Date.now() + '.jpg', { type: 'image/jpeg' }))
  }, 'image/jpeg', 0.9)
}

function sparkline(vals) {
  if (!vals.length) return empty('market', '—')
  var w = 320, h = 110, max = Math.max.apply(null, vals), min = Math.min.apply(null, vals), rng = (max - min) || 1
  var pts = vals.map(function (v, i) { var x = (i / (vals.length - 1 || 1)) * w; var y = h - ((v - min) / rng) * (h - 12) - 6; return x.toFixed(1) + ',' + y.toFixed(1) }).join(' ')
  var dots = vals.map(function (v, i) { var x = (i / (vals.length - 1 || 1)) * w; var y = h - ((v - min) / rng) * (h - 12) - 6; return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="var(--maize)"/>' }).join('')
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none"><polyline points="' + pts + '" fill="none" stroke="var(--leaf)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' + dots + '</svg>'
}

// Multi-line market chart: one coloured line per product + legend.
// series = [{ name, color, pts:[{label, price}] }]  (already sorted oldest->newest)
function multiLineChart(series) {
  if (!series.length) return empty('market', '—')
  var W = 700, H = 300, padL = 64, padR = 16, padT = 16, padB = 46
  var iw = W - padL - padR, ih = H - padT - padB
  var all = []; series.forEach(function (s) { s.pts.forEach(function (p) { all.push(p.price) }) })
  var max = Math.max.apply(null, all), min = Math.min.apply(null, all)
  if (max === min) { max = max + 1; min = Math.max(0, min - 1) }
  var maxLen = 0; series.forEach(function (s) { if (s.pts.length > maxLen) maxLen = s.pts.length })
  var labels = (series[0] && series[0].pts.length === maxLen ? series[0] : series.reduce(function (a, b) { return b.pts.length > a.pts.length ? b : a })).pts.map(function (p) { return p.label })
  function X(i) { return padL + (maxLen <= 1 ? iw / 2 : (i / (maxLen - 1)) * iw) }
  function Y(v) { return padT + ih - ((v - min) / (max - min)) * ih }
  // gridlines + y labels (5 steps)
  var grid = ''
  for (var g = 0; g <= 4; g++) {
    var val = min + (max - min) * (g / 4), y = Y(val)
    grid += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>'
    grid += '<text x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--ink-soft)">' + Math.round(val).toLocaleString() + '</text>'
  }
  // x labels (first, middle, last)
  var xlabels = ''
  ;[0, Math.floor((maxLen - 1) / 2), maxLen - 1].forEach(function (i) {
    if (i < 0 || !labels[i]) return
    xlabels += '<text x="' + X(i).toFixed(1) + '" y="' + (H - padB + 22) + '" text-anchor="middle" font-size="11" fill="var(--ink-soft)">' + esc(labels[i]) + '</text>'
  })
  var lines = series.map(function (s) {
    if (!s.pts.length) return ''
    var pts = s.pts.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p.price).toFixed(1) }).join(' ')
    var dots = s.pts.map(function (p, i) { return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.price).toFixed(1) + '" r="3" fill="' + s.color + '"/>' }).join('')
    return '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + dots
  }).join('')
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet">' + grid + xlabels + lines + '</svg>'
  var legend = '<div style="display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px">' + series.map(function (s) {
    var last = s.pts[s.pts.length - 1]
    return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600"><span style="width:12px;height:12px;border-radius:3px;background:' + s.color + ';display:inline-block"></span>' + esc(s.name) + ' <span class="muted" style="font-weight:500">' + (last ? money(last.price) : '') + '</span></span>'
  }).join('') + '</div>'
  return svg + legend
}

// QR generator that always shows something: tries the bundled library,
// and falls back to an online QR image if the library didn't load.
function renderQR(elId, text) {
  var box = document.getElementById(elId); if (!box) return
  function fallback() {
    box.className = ''
    box.innerHTML = '<img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data=' + encodeURIComponent(text) + '" style="width:180px;height:180px;border-radius:14px">'
  }
  if (window.QRCode && window.QRCode.toDataURL) {
    try {
      window.QRCode.toDataURL(text, { margin: 1, width: 360, color: { dark: '#16243f', light: '#ffffff' } }, function (err, url) {
        var b = document.getElementById(elId); if (!b) return
        if (err || !url) { fallback(); return }
        b.className = ''; b.innerHTML = '<img alt="QR" src="' + url + '" style="width:180px;height:180px;border-radius:14px">'
      })
    } catch (e) { fallback() }
  } else { fallback() }
}

function screenCountry() {
  var grid = window.COUNTRIES.map(function (c) {
    return '<button class="opt ' + (S.country === c.code ? 'sel' : '') + '" data-act="country" data-code="' + c.code + '" style="flex-direction:column;align-items:flex-start;gap:6px"><span style="font-weight:700;font-family:var(--display)">' + esc(c.name) + '</span><span class="muted" style="font-size:12px">' + c.currency + '</span></button>'
  }).join('')
  root.innerHTML = '<div class="app-shell"><div class="page-pad fade-in"><div class="wrap-narrow">' +
    '<button class="muted" data-act="back-lang" style="font-size:18px;margin-bottom:14px">' + ic('back', 18) + '</button>' +
    '<h1 style="font-size:30px;color:var(--forest);margin-bottom:6px">' + t('chooseCountry') + '</h1>' +
    '<div class="grid-2" style="margin:18px 0">' + grid + '</div>' +
    '<button class="btn btn-primary" data-act="go-auth">' + t('continue') + '</button>' +
    '</div></div></div>'
}

async function authNext() {
  var err = document.getElementById('autherr'); if (err) err.textContent = ''
  // read step-0 / login fields if present
  if (document.getElementById('f_phone')) A.phone = document.getElementById('f_phone').value.trim()
  if (document.getElementById('f_name')) A.name = document.getElementById('f_name').value.trim()
  if (document.getElementById('f_email')) A.email = document.getElementById('f_email').value.trim()
  if (document.getElementById('f_region')) A.region = document.getElementById('f_region').value
  if (document.getElementById('f_pw')) A.pw = document.getElementById('f_pw').value
  if (document.getElementById('f_size')) A.farmSize = document.getElementById('f_size').value

  if (A.mode === 'login') return doLogin()
  // validate step 0
  if (A.step === 0) {
    if (!A.name || !A.phone || !A.region || !(A.pw && A.pw.length >= 6)) { setAuthErr('Please fill name, phone, region and a 6+ char password.'); return }
    if (A.role === 'buyer') return doSignup()
    A.step = 1; return renderAuth()
  }
  var lastStep = A.role === 'buyer' ? 0 : (A.role === 'doctor' ? 1 : 2)
  if (A.step < lastStep) { A.step++; return renderAuth() }
  return doSignup()
}
function setAuthErr(m) { var e = document.getElementById('autherr'); if (e) e.textContent = m }
// translate raw Supabase messages into clear next steps
function friendlyAuthError(msg) {
  var m = String(msg || '').toLowerCase()
  if (m.indexOf('rate limit') >= 0) return 'Too many signups too quickly. In Supabase, turn OFF Authentication \u2192 Email \u2192 "Confirm email" (WeAgri does not need it). If you just hit the limit, wait about an hour, then try again.'
  if (m.indexOf('already registered') >= 0 || m.indexOf('already been registered') >= 0 || m.indexOf('user already') >= 0) return 'That phone/email already has an account. Tap "Log in" instead.'
  if (m.indexOf('database error') >= 0) return 'Run supabase-fix.sql once in Supabase (SQL Editor), then try again.'
  if (m.indexOf('row-level security') >= 0 || m.indexOf('violates') >= 0) return 'Run supabase-fix.sql in Supabase so profiles can be created, then try again.'
  if (m.indexOf('invalid login') >= 0) return 'Wrong phone (or username) / password, or no account yet \u2014 check details or create an account.'
  if (m.indexOf('failed to fetch') >= 0 || m.indexOf('networkerror') >= 0) return 'Cannot reach the database. If this is the Claude chat preview, that is expected \u2014 use your deployed or local site.'
  return msg || 'Something went wrong. Try again.'
}
// normalize a TZ phone to 255XXXXXXXXX so signup & login always match
function normPhone(p) {
  var d = (p || '').replace(/\D/g, '')
  if (d.indexOf('255') === 0) return d
  if (d.charAt(0) === '0') return '255' + d.slice(1)
  if (d.length === 9) return '255' + d
  return d
}
// mobile-money network from the phone prefix (TZ)
function methodForPhone(p) {
  var d = normPhone(p); var local = d.indexOf('255') === 0 ? '0' + d.slice(3) : d
  var pre = local.slice(0, 3)
  if (pre === '071' || pre === '065') return 'Tigo Pesa'
  if (pre === '078' || pre === '068') return 'Airtel Money'
  if (pre === '075' || pre === '076') return 'M-Pesa'
  return null
}
// auth identity is ALWAYS derived from the phone number (email is optional, stored only in the profile) —
// except the one admin username, which maps to a fixed admin email instead of a phone number.
function authEmail() {
  var typed = (A.phone || '').trim()
  if (typed && typed.toLowerCase() === String(window.CFG.ADMIN_USERNAME || '').toLowerCase()) return window.CFG.ADMIN_EMAIL
  var d = normPhone(A.phone); return (d || (A.email || 'user').split('@')[0]) + '@weagri.app'
}

async function doLogin() {
  try {
    S._busy = true
    var r = await sb.auth.signInWithPassword({ email: authEmail(), password: A.pw })
    S._busy = false
    if (r.error) throw r.error
    S.session = r.data.session
    await afterAuth()
  } catch (e) { S._busy = false; setAuthErr(friendlyAuthError(e.message)) }
}
async function doSignup() {
  try {
    S._busy = true
    // pass everything as user metadata so the database trigger can build the profile
    var meta = {
      full_name: A.name, phone: A.phone || '', region: A.region || '',
      country: S.country, role: A.role,
      seller_type: (A.role === 'seller' || A.role === 'doctor') ? A.sellerType : '',
      farm_size: (A.role === 'seller' && A.sellerType === 'farmer' && A.farmSize) ? String(A.farmSize) : '',
    }
    var su = await sb.auth.signUp({ email: authEmail(), password: A.pw, options: { data: meta } })
    if (su.error) throw su.error
    var user = su.data.user
    if (!user) { S._busy = false; setAuthErr('Account created — please log in.'); A.mode = 'login'; renderAuth(); return }
    S.session = su.data.session
    // Best-effort: if the trigger isn't installed yet but the user IS logged in
    // (Confirm email OFF), this creates the profile directly. If it's blocked by
    // RLS we ignore it — the database trigger handles profile creation.
    var profile = {
      id: user.id, full_name: A.name, phone: A.phone, email: A.email || null,
      region: A.region, country: S.country, role: A.role,
      seller_type: (A.role === 'seller' || A.role === 'doctor') ? A.sellerType : null,
      farm_size: (A.role === 'seller' && A.sellerType === 'farmer') ? (Number(A.farmSize) || null) : null,
      qr_code: window.H.makeQrPayload(user.id),
    }
    await sb.from('profiles').upsert(profile)   // error (if any) ignored on purpose
    if (A.role === 'seller') {
      if (A.sellerType === 'farmer' && A.crops.length) await sb.from('crops').insert(A.crops.map(function (n) { return { profile_id: user.id, name: n } }))
      else if (A.sellerType === 'livestock' && A.animals.length) await sb.from('livestock').insert(A.animals.map(function (a) { return { profile_id: user.id, animal_type: a.name, count: a.count } }))
      else if ((A.sellerType === 'seed' || A.sellerType === 'fertilizer') && A.items.length) await sb.from('crops').insert(A.items.map(function (n) { return { profile_id: user.id, name: n } }))
    }
    S._busy = false
    await afterAuth()
    if (!S.profile) { setAuthErr('Account created. If it did not sign you in, turn OFF "Confirm email" in Supabase, then log in.'); A.mode = 'login'; renderAuth() }
  } catch (e) { S._busy = false; setAuthErr(friendlyAuthError(e.message)) }
}

  loadSellerDiscoverBody()

  try {
    var seg = ({ farmer: 'crop', livestock: 'livestock', seed: 'seed', fertilizer: 'fertilizer' })[S.profile.seller_type] || 'crop'
    var r = await sb.from('market_prices').select('*').order('recorded_at', { ascending: true }).limit(600)
    var rows = r.data || []
    var segged = rows.filter(function (x) { return x.segment === seg })

    rows.forEach(function (x) {

      ;(byProd[x.product_name] = byProd[x.product_name] || []).push({ label: lbl, price: Number(x.price) })

async function loadGroups() {
  var box = document.getElementById('groups'); if (!box) return
  try {
    var mem = await sb.from('seller_group_members').select('group_id').eq('member_id', S.profile.id)
    var myIds = (mem.data || []).map(function (m) { return m.group_id })
    var all = await sb.from('seller_groups').select('*, seller_group_members(count)').order('created_at', { ascending: false }).limit(40)
    var groups = all.data || []
    var mine = groups.filter(function (g) { return myIds.indexOf(g.id) >= 0 })
    var others = groups.filter(function (g) { return myIds.indexOf(g.id) < 0 })
    function count(g) { return (g.seller_group_members && g.seller_group_members[0]) ? g.seller_group_members[0].count : 0 }
    function row(g, joined) {
      return '<div class="card" style="padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">' + avatar(g.name, 40, 'var(--leaf)') +
        '<div style="flex:1;min-width:0"><b style="font-size:15px">' + esc(g.name) + '</b><div class="muted" style="font-size:12px">' + count(g) + ' ' + t('membersWord') + '</div></div>' +
        (joined
          ? '<button class="btn btn-primary" style="width:auto;padding:8px 14px;font-size:13px" data-act="opengroup" data-id="' + g.id + '" data-name="' + esc(g.name) + '" data-owner="' + esc(g.owner_id || '') + '">' + ic('chat', 14) + '</button>'
          : '<button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:13px" data-act="joingroup" data-id="' + g.id + '">' + t('joinGroup') + '</button>') +
        '</div>'
    }
    var html = ''
    html += '<div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin:4px 0 8px">' + t('myGroups') + '</div>'
    html += mine.length ? mine.map(function (g) { return row(g, true) }).join('') : empty('group', t('noGroups'))
    if (others.length) {
      html += '<div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin:16px 0 8px">' + t('discoverGroups') + '</div>'
      html += others.map(function (g) { return row(g, false) }).join('')
    }
    box.innerHTML = html
  } catch (e) {
    box.innerHTML = empty('group', 'Run supabase-update-2.sql in Supabase to enable seller groups.')
  }
}

async function setOrderStatus(id, status, buyerId) {
  try {
    await sb.from('orders').update({ status: status, delivery_status: status === 'completed' ? 'awaiting_confirmation' : (status === 'accepted' ? 'in_transit' : 'preparing') }).eq('id', id)
    if (status === 'accepted') notify(buyerId, 'order', S.profile.full_name + ' ' + t('orderReceivedMsg'), '')
    if (status === 'completed') {
      var o = await sb.from('orders').select('products(title, group_id)').eq('id', id).maybeSingle()
      var prod = o.data && o.data.products
      if (prod && prod.group_id) notifyGroup(prod.group_id, 'sold', t('soldTitle'), (prod.title || '') + ' ' + t('soldMsg'))
      // notify buyer to confirm receipt
      notify(buyerId, 'order', S.profile.full_name + ' has marked your order as delivered. Did you receive it?', 'Open your Orders tab and press Yes Received or Not Yet.', { order_id: id })
    }
    if (status === 'completed') toast('Waiting for buyer confirmation. Not yet marked as delivered.')
    sellerOrders()
  } catch (e) { showErr(e.message) }
}

// show the buyer's location on a map (embedded, no navigation)
function openBuyerLocation(lat, lng, name, loc) {
  lat = Number(lat); lng = Number(lng)
  var d = 0.01
  var bbox = (lng - d) + ',' + (lat - d) + ',' + (lng + d) + ',' + (lat + d)
  var src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + lat + ',' + lng
  var gmaps = 'https://www.google.com/maps?q=' + lat + ',' + lng
  openSheet(name, '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' + avatar(name, 40) + '<div><b>' + esc(name) + '</b>' + (loc ? '<div class="muted" style="font-size:12px">' + esc(loc) + '</div>' : '') + '</div></div>' +
    '<iframe title="map" src="' + src + '" style="width:100%;height:300px;border:0;border-radius:14px"></iframe>' +
    '<div class="muted" style="font-size:12px;margin-top:8px">' + ic('pin', 12) + ' ' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</div>' +
    '<a class="btn btn-primary" style="margin-top:12px" href="' + gmaps + '" target="_blank" rel="noopener">' + ic('pin', 16) + ' ' + t('openInMaps') + '</a>' +

}

    field(t('price'), '<input class="input" id="p_price" type="number">') +
    '<div id="p_notice"></div><div id="p_total"></div>' +
    field(t('description'), '<textarea class="textarea" id="p_desc" rows="2"></textarea>') +
    '<button class="btn btn-primary" data-act="post-product">' + t('post') + '</button>' +
    '<button class="btn btn-ghost" data-close style="margin-top:8px">' + t('cancel') + '</button>'
  openSheet(t('addProduct'), html, function () {
    S._pcat = 'vegetables'; highlightCat()
    sb.from('market_prices').select('*').order('recorded_at', { ascending: false }).limit(60).then(function (r) { S._mkt = r.data || []; recalcNotice() })
    $('#p_photo').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return; S._photo = f
      var lbl = $('#photolabel')
      lbl.style.backgroundImage = "url('" + URL.createObjectURL(f) + "')"; lbl.style.backgroundSize = 'contain'
      var ph = $('#photoph'); if (ph) ph.style.display = 'none'
    })
    ;['p_title', 'p_price', 'p_qty'].forEach(function (id) { $('#' + id).addEventListener('input', recalcNotice) })
  })
}
function highlightCat() { Array.prototype.forEach.call(document.querySelectorAll('#pcats .chip'), function (b) { b.classList.toggle('selected', b.getAttribute('data-v') === S._pcat) }) }
function recalcNotice() {
  var title = ($('#p_title') || {}).value || '', price = ($('#p_price') || {}).value || '', qty = ($('#p_qty') || {}).value || ''
  var row = window.H.findMarketRow(S._mkt, title, S._pcat)
  var cmp = window.H.marketCompare(price, row)
  var nb = $('#p_notice')
  if (cmp.status && nb) {
    var icon = cmp.status === 'fair' ? ic('check', 18) : ic('market', 18)
    var titleTxt = cmp.status === 'high' ? t('priceHigh') : cmp.status === 'low' ? t('priceLow') : t('priceFair')
    var msg = (cmp.status === 'high' ? t('priceHighMsg') : cmp.status === 'low' ? t('priceLowMsg') : t('priceFairMsg')).replace('{pct}', Math.abs(cmp.pct)).replace('{ref}', money(cmp.ref) + '/' + cmp.unit)
    nb.innerHTML = '<div class="notice ' + cmp.status + '"><div>' + icon + '</div><div><b style="font-size:13px">' + titleTxt + '</b><p style="font-size:12px;margin-top:2px">' + esc(msg) + '</p></div></div>'
  } else if (nb) nb.innerHTML = ''
  var total = Number(price || 0) * Number(qty || 0)
  var tb = $('#p_total'); if (tb) tb.innerHTML = total > 0 ? '<div class="chip" style="margin-bottom:14px;background:var(--bone-2);font-weight:700">' + t('totalLabel') + ': ' + money(total) + '</div>' : ''
}
async function postProduct() {
  try {
    var title = $('#p_title').value.trim(), price = Number($('#p_price').value)
    if (!title || !price) { toast('Add a name and price'); return }
    var photo_url = null
    if (S._photo) {
      var path = S.profile.id + '/' + Date.now() + '-' + S._photo.name.replace(/[^\w.\-]/g, '_')
      var up = await sb.storage.from('product-photos').upload(path, S._photo, { upsert: true })
      if (!up.error) photo_url = sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl
    }
    var ins = await sb.from('products').insert({
      seller_id: S.profile.id, title: title, category: S._pcat, quantity: Number($('#p_qty').value || 0),
      unit: $('#p_unit').value, price: price, description: $('#p_desc').value.trim(),
      region: S.profile.region, country: S.profile.country, photo_url: photo_url, status: 'available',
    })
    if (ins.error) throw ins.error
    closeSheet(); toast(t('post')); sellerHome()
  } catch (e) { showErr(e.message) }
}

// ── Recommendation engine ───────────────────────────────────────────────
// Same idea as YouTube's feed: build a per-buyer taste profile from every
// signal we have (what they searched, viewed, bought, and said they like),
// weight recent activity higher than old activity, score every candidate
// product against that profile, then re-rank for diversity so the feed
// isn't just "20 tomatoes" because of one search — the same purpose YouTube's
// diversity pass serves so a feed isn't 20 videos from one channel.
var REC = { profile: null, profileLoaded: false }
function recDaysAgo(iso) { return (Date.now() - new Date(iso).getTime()) / 86400000 }
function recDecay(days, halfLifeDays) { return Math.pow(0.5, Math.max(0, days) / halfLifeDays) }
function recBump(map, key, w) { if (key === undefined || key === null || key === '') return; map[key] = (map[key] || 0) + w }

async function loadUserProfile() {
  if (REC.profileLoaded) return REC.profile
  var uid = S.profile.id
  var catScore = {}, wordScore = {}, sellerScore = {}

  // 1) Search history (search-sellers bar) — explicit intent, decays over ~2 weeks
  try {
    var sh = await sb.from('search_history').select('query,created_at').eq('buyer_id', uid).order('created_at', { ascending: false }).limit(80)
    ;(sh.data || []).forEach(function (row) {
      var w = 3 * recDecay(recDaysAgo(row.created_at), 14)
      var ql = String(row.query || '').toLowerCase()
      ql.split(/\s+/).forEach(function (word) {
        word = word.replace(/[^a-z0-9\u00c0-\u024f]/gi, '')
        if (word.length >= 3) recBump(wordScore, word, w)
      })
      ;(window.CATEGORIES || []).forEach(function (c) {
        if (ql.indexOf(c.key) !== -1 || ql.indexOf(String(c.label).toLowerCase()) !== -1) recBump(catScore, c.key, w)
      })
    })
  } catch (e) { /* table not set up yet — profile just stays thinner */ }

  // 2) Recently viewed products — implicit browsing signal, decays over ~10 days
  try {
    var pv = await sb.from('product_views').select('created_at, products(category,seller_id)').eq('viewer_id', uid).order('created_at', { ascending: false }).limit(120)
    ;(pv.data || []).forEach(function (row) {
      var p = row.products; if (!p) return
      var w = 1.5 * recDecay(recDaysAgo(row.created_at), 10)
      recBump(catScore, p.category, w)
      recBump(sellerScore, p.seller_id, w)
    })
  } catch (e) {}

  // 3) Past orders — strongest signal (money talks), decays slowly over ~60 days
  try {
    var od = await sb.from('orders').select('created_at,status,products(category,seller_id)').eq('buyer_id', uid).neq('status', 'cancelled').order('created_at', { ascending: false }).limit(100)
    ;(od.data || []).forEach(function (row) {
      var p = row.products; if (!p) return
      var w = 6 * recDecay(recDaysAgo(row.created_at), 60)
      recBump(catScore, p.category, w)
      recBump(sellerScore, p.seller_id, w * 1.3)
    })
  } catch (e) {}

  // 4) Stated crop interests (Settings → harvest alerts) — explicit, doesn't decay
  try {
    var ci = await sb.from('buyer_crop_interests').select('crop_name').eq('buyer_id', uid)
    ;(ci.data || []).forEach(function (row) { recBump(wordScore, String(row.crop_name || '').toLowerCase(), 4) })
  } catch (e) {}

  // 5) Favorited sellers — explicit, doesn't decay
  try {
    var fv = await sb.from('favorites').select('seller_id').eq('buyer_id', uid)
    ;(fv.data || []).forEach(function (row) { recBump(sellerScore, row.seller_id, 6) })
  } catch (e) {}

  REC.profile = { catScore: catScore, wordScore: wordScore, sellerScore: sellerScore }
  REC.profileLoaded = true
  return REC.profile
}
// Popularity signal ("what everyone's watching") scoped to just the candidates on screen.
async function loadPopularity(ids) {
  var views = {}, orders = {}
  if (!ids.length) return { views: views, orders: orders }
  try {
    var vr = await sb.from('product_views').select('product_id').in('product_id', ids)
    ;(vr.data || []).forEach(function (r) { views[r.product_id] = (views[r.product_id] || 0) + 1 })
  } catch (e) {}
  try {
    var orr = await sb.from('orders').select('product_id').in('product_id', ids).neq('status', 'cancelled')
    ;(orr.data || []).forEach(function (r) { orders[r.product_id] = (orders[r.product_id] || 0) + 1 })
  } catch (e) {}
  return { views: views, orders: orders }
}
function scoreProduct(p, profile, pop) {
  var s = 0
  if (window.H.isBoosted(p)) s += 1000 // paid promotion — always tops the feed, like an ad slot
  s += 40 * (profile.sellerScore[p.seller_id] || 0)   // "you buy/view/favorite this seller a lot"
  s += 25 * (profile.catScore[p.category] || 0)        // "you're into this category"
  var hay = ((p.title || '') + ' ' + (p.category || '')).toLowerCase()
  for (var w in profile.wordScore) { if (hay.indexOf(w) !== -1) s += profile.wordScore[w] } // keyword match to searches/interests
  if (p.region === S.profile.region) s += 8            // regional relevance
  s += Math.min(20, (pop.views[p.id] || 0) * 0.6 + (pop.orders[p.id] || 0) * 2.2) // trending/social proof, capped
  var ageDays = recDaysAgo(p.created_at)
  s += Math.max(0, 6 - ageDays * 0.3)                   // freshness, fades over ~20 days
  s += Math.random() * 1.5                              // small exploration jitter so the feed keeps moving
  return s
}
// Diversity re-rank: greedily pick the best-scoring item, but discount items
// from a seller/category shown very recently — same purpose as YouTube not
// stacking 5 videos from one channel back-to-back.
function diversifyFeed(list) {
  var pool = list.slice(), out = [], recentSellers = [], recentCats = []
  while (pool.length) {
    var bestIdx = 0, bestAdj = -Infinity
    for (var i = 0; i < pool.length; i++) {
      var p = pool[i]
      var sellerPenalty = recentSellers.slice(-3).filter(function (s) { return s === p.seller_id }).length
      var catPenalty = recentCats.slice(-4).filter(function (c) { return c === p.category }).length
      var adj = p._score - sellerPenalty * 15 - catPenalty * 6
      if (adj > bestAdj) { bestAdj = adj; bestIdx = i }
    }
    var chosen = pool.splice(bestIdx, 1)[0]
    out.push(chosen)
    recentSellers.push(chosen.seller_id); recentCats.push(chosen.category)
  }
  return out
}

// ── Seller tiering: "Most suggested" vs "Suggestions" ──────────────────
// Most suggested = sellers completing a lot of orders in a short recent
// window (high order velocity). Suggestions = sellers completing a normal
// or small number of orders in that same window — still shown, just not
// pushed to the top, so smaller/newer sellers still get discovered.
REC.velocity = null
REC.velocityLoaded = false
function isCompletedOrder(o) {
  return o.status === 'completed' || o.status === 'confirmed' || o.delivery_status === 'confirmed'
}
async function loadSellerVelocity() {
  if (REC.velocityLoaded) return REC.velocity
  var since = new Date(Date.now() - 14 * 86400000).toISOString()
  var counts = {}
  try {
    var r = await sb.from('orders').select('seller_id,status,delivery_status,created_at').gte('created_at', since)
    ;(r.data || []).forEach(function (o) { if (isCompletedOrder(o)) counts[o.seller_id] = (counts[o.seller_id] || 0) + 1 })
  } catch (e) {}
  var vals = Object.keys(counts).map(function (k) { return counts[k] }).sort(function (a, b) { return b - a })
  var threshold = Infinity
  if (vals.length) {
    var pIdx = Math.max(0, Math.floor(vals.length * 0.3) - 1) // top ~30% of sellers who completed orders recently
    threshold = Math.max(2, vals[pIdx]) // a single order alone never counts as "most suggested"
  }
  REC.velocity = { counts: counts, threshold: threshold }
  REC.velocityLoaded = true
  return REC.velocity
}

// ask the device for the buyer's location (browser shows the permission prompt)
function getLocation() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) { resolve(null); return }
    navigator.geolocation.getCurrentPosition(
      function (pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }) },
      function () { resolve(null) },
      { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 }
    )
  })
}
async function reverseGeocode(lat, lng) {
  try {
    var res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=14&lat=' + lat + '&lon=' + lng)
    var j = await res.json()
    var a = j.address || {}
    return a.suburb || a.neighbourhood || a.village || a.town || a.city || a.county || j.display_name || null
  } catch (e) { return null }
}
async function doBuy() {
  var p = S._cur

  setSheetBody('<div class="center" style="padding:24px">' + spinner() + '<p class="muted" style="margin-top:8px">' + t('locating') + '</p></div>')
  var loc = await getLocation()
  var locName = ''
  if (loc) { locName = (await reverseGeocode(loc.lat, loc.lng)) || (loc.lat.toFixed(4) + ', ' + loc.lng.toFixed(4)) }
  if (!locName) locName = S.profile.region || ''
  try {
    var base = { buyer_id: S.profile.id, seller_id: p.seller_id, product_id: p.id, quantity: S._qty, total_price: S._qty * Number(p.price), status: 'pending', delivery_status: 'preparing' }

    var ins = await sb.from('orders').insert(withLoc)
    if (ins.error) { ins = await sb.from('orders').insert(base) }  // fallback if location columns not added yet
    if (ins.error) throw ins.error

/* ---------------- MULTIPLE ACCOUNTS (max 2) ---------------- */
function getAccounts() { try { return JSON.parse(SAFE.getItem('w_accounts') || '[]') } catch (e) { return [] } }
function saveAccounts(a) { SAFE.setItem('w_accounts', JSON.stringify(a)) }
function recordAccount() {
  if (!S.session || !S.profile) return
  var list = getAccounts()
  var entry = { id: S.profile.id, label: S.profile.full_name, role: S.profile.role, seller_type: S.profile.seller_type, email: S.session.user.email, access_token: S.session.access_token, refresh_token: S.session.refresh_token }
  var i = list.findIndex(function (x) { return x.id === entry.id })
  if (i >= 0) list[i] = entry; else list.push(entry)
  saveAccounts(list.slice(0, 2))
}
async function switchAccount(id) {
  var acc = getAccounts().find(function (x) { return x.id === id }); if (!acc) return
  try {
    S._busy = true
    var r = await sb.auth.setSession({ access_token: acc.access_token, refresh_token: acc.refresh_token })
    S._busy = false
    if (r.error) throw r.error
    S.session = r.data.session
    closeSheet(); await afterAuth()
  } catch (e) { S._busy = false; showErr('Could not switch account, please log in again. ' + (e.message || '')) }
}

async function doAddAccount() {
  var nt = S._newacct || { type: 'buyer' }
  var name = ($('#na_name') || {}).value, pw = ($('#na_pw') || {}).value || ''
  name = (name || '').trim()
  if (!name || pw.length < 6) { toast(t('newPassword')); return }
  if (getAccounts().length >= 2) { toast(t('maxAccounts')); return }
  var role = nt.type === 'buyer' ? 'buyer' : 'seller'
  var sellerType = nt.type === 'buyer' ? '' : nt.type
  var email = 'a' + Date.now().toString(36) + '.' + (S.profile.phone || 'u').replace(/\D/g, '') + '@weagri.app'
  try {
    S._busy = true
    recordAccount() // make sure current account is saved before we switch
    var meta = { full_name: name, phone: S.profile.phone || '', region: S.profile.region || '', country: S.country, role: role, seller_type: sellerType, farm_size: '' }
    var su = await sb.auth.signUp({ email: email, password: pw, options: { data: meta } })
    if (su.error) throw su.error
    S.session = su.data.session
    // best-effort profile (trigger also creates it)
    if (su.data.user) {
      await sb.from('profiles').upsert({ id: su.data.user.id, full_name: name, phone: S.profile.phone, region: S.profile.region, country: S.country, role: role, seller_type: sellerType || null, qr_code: window.H.makeQrPayload(su.data.user.id) })
    }
    S._busy = false
    await afterAuth()       // loads the new profile
    recordAccount()         // save the new account too
    closeSheet(); toast(t('saved'))
  } catch (e) { S._busy = false; setAuthErr ? setAuthErr(friendlyAuthError(e.message)) : 0; showErr(friendlyAuthError(e.message)) }
}

function helpContent() {

    section('Getting started', 'WeAgri connects farmers, livestock farmers, seed sellers and fertilizer sellers directly with buyers. Choose your language (Swahili or English) and your country, then create a free account as a Buyer or a Seller. Everything — creating an account and posting products — is free.') +
    section('Creating an account', 'Pick whether you are a Buyer or a Seller. Sellers also pick a type: Crop Farmer, Livestock Farmer, Seed Seller or Fertilizer Seller. Enter your name (this is also the username buyers search for), phone number, region and a password of at least 6 characters. Email is optional.') +

    section('Ordering & ratings', 'Buyers order straight from any seller\u2019s post. When you place an order the seller is notified; when the seller accepts it, you are notified. After the deal is complete (in person or through the app) the buyer rates the seller from 1 to 6 stars, and the seller is notified of the score. Ratings help everyone find sellers who treat customers fairly.') +

function aboutContent() {

    section('Why we created WeAgri', 'Across Tanzania and East Africa, hard-working farmers, livestock farmers, seed sellers and fertilizer sellers often struggle to reach buyers and to know a fair price for their goods. Middlemen take a large share, prices are unclear, and small sellers have little visibility. We built WeAgri to put that power back into the hands of the people who grow and supply our food.') +
    section('Our mission', 'To give every farmer and agricultural seller — no matter how small — a free, simple and trusted place to sell directly to buyers, to see fair market prices, and to grow their income. We want technology to strengthen local food systems, not replace the people in them.') +
    section('What WeAgri does', 'WeAgri is a free marketplace where sellers post their produce, animals, seeds and fertilizer, and buyers browse, search and order directly. It shows live market-price guidance, lets sellers boost listings to reach more buyers, tracks who viewed each product, supports seller groups with group chat, and uses QR codes so buyers can verify and trace a seller.') +

    section('Benefits for buyers', 'Discover fresh produce, livestock, seeds and inputs near you; search any seller by name and filter by type; see live market prices; verify sellers by scanning their QR code; and message sellers directly before you buy.') +
    section('Built for the region', 'WeAgri works in Swahili and English, is mobile-first so it runs well on everyday phones, and supports mobile-money payments (M-Pesa, Tigo Pesa, Airtel Money) that people already use and trust.') +

    '<p style="margin-top:20px">Questions or partnership ideas? Email <a href="mailto:hello@weagri.app">hello@weagri.app</a>.</p>'

// ── Availability calculation (pure date math, no cron needed) ──────────
function wgHarvestAvailability(h) {
  if (h.status === 'sold') return { label: t('soldOut'), color: '#888', bg: '#eee', dot: '#888' }
  if (h.status === 'reserved') return { label: t('reserved'), color: '#7c3aed', bg: '#efe6fc', dot: '#7c3aed' }

  var today = new Date(); today.setHours(0,0,0,0)
  var hd = new Date(h.expected_date + 'T00:00:00'); hd.setHours(0,0,0,0)
  var days = Math.round((hd - today) / 86400000)

  if (h.status === 'available' || days <= 0) {
    return { label: t('availableNow'), color: '#166534', bg: 'var(--leaf-soft)', dot: '#22c55e', days: 0 }
  }
  if (days === 1) return { label: t('availableTomorrow'), color: '#b45309', bg: 'var(--maize-soft)', dot: '#f59e0b', days: 1 }
  if (days <= 7) return { label: t('availableInDays').replace('{n}', days), color: '#b45309', bg: 'var(--maize-soft)', dot: '#f59e0b', days: days }
  if (days <= 31) return { label: t('availableNextWeek'), color: '#c2410c', bg: '#fde7d4', dot: '#f97316', days: days }
  return { label: t('availableNextMonth'), color: '#1565c0', bg: '#e0ecfb', dot: '#3b82f6', days: days }
}

function wgHarvestCountdown(h) {
  var av = wgHarvestAvailability(h)
  if (h.status === 'sold' || h.status === 'reserved') return av.label
  if (av.days === 0) return t('availableNow')
  return av.days + ' ' + t('daysRemaining')
}

// ── Crop icon tile (deterministic color from crop name, like avatar()) ──
var _wgCropPalette = ['#1f3d2b','#2d8a2d','#c85a3a','#e8b04b','#3f7d4f','#7c3aed','#1565c0','#b45309']
function wgCropTile(cropName, size) {
  size = size || 48
  var sum = 0; for (var i = 0; i < cropName.length; i++) sum += cropName.charCodeAt(i)
  var bg = _wgCropPalette[sum % _wgCropPalette.length]
  return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:' + (size > 60 ? 16 : 12) + 'px;background:' + bg + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff">' + ic('leaf', Math.round(size * 0.5)) + '</div>'
}

  if (!_wgHF.expected_date) { toast('Please select the expected harvest date'); return }
  if (!_wgHF.quantity || Number(_wgHF.quantity) <= 0) { toast('Please enter the expected quantity'); return }
  try {
    var row = {
      farmer_id: S.profile.id, crop_name: _wgHF.crop_name, expected_date: _wgHF.expected_date,
      quantity: Number(_wgHF.quantity), unit: _wgHF.unit, quality: _wgHF.quality,
      notes: _wgHF.notes || null, visibility: _wgHF.visibility, updated_at: new Date().toISOString()
